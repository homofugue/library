<title>Library Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen reading room — header strip, filter rail, graph left, reading panel right; stacks on phones.
   Color: ink for works; three validated hues — blue themes, orange captures (quotes, texts, images), aqua people;
   publishers / honors / places are muted and off by default. */
:root{
  --bg:#F4F1EA; --surface:#FBFAF6; --ink:#1F1D1A; --muted:#6B675F; --faint:#9A958B;
  --line:rgba(31,29,26,.12); --edge:rgba(31,29,26,.20); --wash:rgba(31,29,26,.05);
  --work:#1F1D1A; --theme:#2a78d6; --capture:#eb6834; --person:#1baf7a; --meta:#8E887C;
  --focus:#2a78d6;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-inline:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:14px 6px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:.005em}
.count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-block:4px 8px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:.78rem var(--f-body);cursor:pointer;padding:3px 2px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.work .sw{border-radius:1.5px;width:8px;height:11px}
.chip.field .sw{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.rank .sw.field{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fields button{all:unset;cursor:pointer;font-family:var(--f-display);font-size:1rem;padding:5px 12px;border:1.5px solid var(--ink);border-radius:999px}
.fields button:hover{background:var(--wash)}
.fields button.sub{font-size:.85rem;border-style:dashed;opacity:.85}
.chip.text .sw{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.chip.image .sw{border-radius:2px;width:11px;height:11px}
.chip.marginalia .sw,.chip.stub .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip[aria-pressed="false"]{color:var(--faint)}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip .n{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.sep{width:1px;height:14px;background:var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#graph svg{width:100%;height:100%;display:block;cursor:grab}
#graph svg:active{cursor:grabbing}
.hint{position:absolute;left:0;bottom:8px;font-size:.7rem;color:var(--faint);pointer-events:none}
.ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.ctl button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 .75rem var(--f-body);padding:4px 9px;border-radius:6px;cursor:pointer}
.ctl button:hover{color:var(--ink)}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:16px 2px 28px 20px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
aside h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
aside h3{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:20px 0 8px}
.byline{color:var(--muted);margin:0}
.byline button,.linkish{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.byline button:hover,.linkish:hover{border-color:var(--ink)}
.cover{width:112px;aspect-ratio:2/3;max-width:100%;border-radius:2px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.14)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.type{display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:.8rem;line-height:1.2}
.cover.type small{font-family:var(--f-body);font-size:.6rem;opacity:.75}
.pic{margin:0 0 14px;border-radius:3px;overflow:hidden;background:var(--wash);box-shadow:0 1px 0 var(--line),0 8px 22px rgba(0,0,0,.14)}
.pic img{width:100%;height:auto;display:block}
.pic.small{width:140px}
.quote{font-family:var(--f-display);font-size:1.02rem;line-height:1.5;margin:12px 0 0;padding-left:12px;border-left:2px solid var(--capture);white-space:pre-wrap}
.poem{font-family:var(--f-display);font-size:1rem;line-height:1.55;margin:12px 0 0;white-space:pre-wrap}
.prose{margin:12px 0 0;max-width:60ch;white-space:pre-wrap}
.summary{margin:12px 0 0;max-width:62ch}
.attrib{color:var(--muted);font-size:.82rem;margin:8px 0 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:.82rem}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;font:.76rem var(--f-body);padding:3px 9px;cursor:pointer}
.tag:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.tag.proposed{border-style:dashed}
.pill{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}
ul.rank,ol.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 6px;border-radius:6px;cursor:pointer}
.rank button:hover,.rank button:focus-visible{background:var(--wash)}
.rank .sw{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.rank .sw.work{border-radius:1.5px;width:7px;height:10px}
.rank .sw.text{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.rank .sw.image{border-radius:2px;width:10px;height:10px}
.rank .sw.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.rank .t{min-width:0}
.rank .t i{font-style:italic}
.rank .why{display:block;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;margin-top:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{all:unset;cursor:pointer;border-radius:3px;overflow:hidden;background:var(--wash);aspect-ratio:1;display:block}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button:hover img{opacity:.85}
.back{all:unset;cursor:pointer;font-size:.78rem;color:var(--muted);margin-bottom:12px;display:inline-block}
.back:hover{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.shelf button{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.shelf button:hover{border-color:var(--c)}
.shelf .big{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.shelf .lab{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.shelf .lab .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.node text{font-family:var(--f-body);font-size:10px;fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.work text{font-family:var(--f-display);font-size:11.5px;fill:var(--ink)}
.node.field text{font-family:var(--f-display);font-size:15px;fill:var(--ink);text-transform:lowercase;letter-spacing:.01em}
.node.theme text{font-weight:500;fill:var(--ink)}
.node{cursor:pointer}
.link{stroke:var(--edge);fill:none}
.dim{opacity:.1}
.node.hit .mark{stroke:var(--focus);stroke-width:2.5px}
.node.sel .mark{stroke:var(--focus);stroke-width:3px}
.empty{color:var(--muted);font-size:.85rem}
a{color:inherit}
@media (max-width:760px){
  .app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  #graph{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:16px 0 32px}
  .tools{margin-left:0}
  input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Library Constellation</h1>
    <span class="count" id="count"></span>
    <div class="tools">
      <input type="search" id="q" placeholder="Search titles, people, quotes…" aria-label="Search the library">
    </div>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Show or hide node types"></div>
  <main>
    <div id="graph">
      <svg id="svg" role="img" aria-label="Network of works, quotes, texts, images, people and themes"></svg>
      <div class="hint">Drag to pan · scroll to zoom · click to read · double-click to centre</div>
      <div class="ctl"><button id="fit" type="button">Fit</button><button id="clear" type="button">Clear</button></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = /*DATA*/null;
const TYPES = {
  field:{label:"Fields",c:"--work",on:true}, work:{label:"Works",c:"--work",on:true}, quote:{label:"Quotes",c:"--capture",on:true}, marginalia:{label:"Marginalia",c:"--capture",on:true},
  text:{label:"Texts",c:"--capture",on:true}, image:{label:"Images",c:"--capture",on:true},
  person:{label:"People",c:"--person",on:true}, theme:{label:"Themes",c:"--theme",on:true},
  imprint:{label:"Publishers & journals",c:"--meta",on:false}, honor:{label:"Honors",c:"--meta",on:false}, geo:{label:"Places & languages",c:"--meta",on:false}
};
const FIELD_LABEL = {field:"field",parent:"within",themes:"theme",author:"author",translator:"translator",editor:"editor",creator:"creator",via:"via",work:"from",in:"in",publisher:"publisher",series:"series",institution:"held at",awards:"award",shortlists:"shortlist",published:"published in","original language":"language",related:"related"};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const deg = new Map();
DATA.edges.forEach(e => { deg.set(e.source,(deg.get(e.source)||0)+1); deg.set(e.target,(deg.get(e.target)||0)+1); });
const nbrs = new Map();
DATA.edges.forEach(e => { (nbrs.get(e.source)||nbrs.set(e.source,[]).get(e.source)).push({id:e.target,field:e.field}); (nbrs.get(e.target)||nbrs.set(e.target,[]).get(e.target)).push({id:e.source,field:e.field,rev:true}); });

// ---------- state ----------
let selected = null, showStubs = false;
const visible = Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v.on]));
try { const s = JSON.parse(localStorage.getItem("lc2-filters")); if (s) Object.assign(visible, s); const st = localStorage.getItem("lc2-stubs"); if (st!==null) showStubs = st==="1"; } catch(e){}
const save = () => { try{ localStorage.setItem("lc2-filters", JSON.stringify(visible)); localStorage.setItem("lc2-stubs", showStubs?"1":"0"); }catch(e){} };

// ---------- filters ----------
const filtersEl = document.getElementById("filters");
function buildFilters(){
  filtersEl.innerHTML = "";
  Object.entries(TYPES).forEach(([t,info]) => {
    const n = DATA.nodes.filter(x=>x.type===t).length; if (!n) return;
    const b = document.createElement("button"); b.type="button";
    b.className = "chip "+t; b.style.setProperty("--c", `var(${info.c})`);
    b.innerHTML = `<span class="sw"></span>${info.label} <span class="n">${n}</span>`;
    b.setAttribute("aria-pressed", visible[t]);
    b.onclick = () => { visible[t] = !visible[t]; b.setAttribute("aria-pressed", visible[t]); save(); render(); };
    filtersEl.appendChild(b);
  });
  const sep = document.createElement("span"); sep.className="sep"; filtersEl.appendChild(sep);
  const s = document.createElement("button"); s.type="button"; s.className="chip stub"; s.style.setProperty("--c","var(--meta)");
  const ns = DATA.nodes.filter(x=>x.stub).length;
  s.innerHTML = `<span class="sw"></span>Linked names without a note <span class="n">${ns}</span>`;
  s.setAttribute("aria-pressed", showStubs);
  s.onclick = () => { showStubs=!showStubs; s.setAttribute("aria-pressed", showStubs); save(); render(); };
  filtersEl.appendChild(s);
}
buildFilters();
const written = DATA.nodes.filter(n=>!n.stub).length;
document.getElementById("count").textContent = `${written} notes · ${DATA.nodes.length-written} linked names · built ${DATA.built}`;

// ---------- graph ----------
const svg = d3.select("#svg"), root = svg.append("g");
const defs = svg.append("defs");
const gLinks = root.append("g"), gNodes = root.append("g");
let userZoomed = false;
const zoom = d3.zoom().scaleExtent([.25,5]).on("zoom", e => { root.attr("transform", e.transform); if (e.sourceEvent) userZoomed = true; });
svg.call(zoom).on("dblclick.zoom", null);
let sim, nodeSel, linkSel, fitted = false, current = {nodes:[],links:[]};
const pos = new Map();
function size(){ const r = document.getElementById("graph").getBoundingClientRect(); return [Math.max(r.width,300), Math.max(r.height,300)]; }
function radius(n){
  const d = deg.get(n.id)||0;
  if (n.type==="field") return 12 + Math.sqrt(d)*2.6;
  if (n.type==="work") return 7 + Math.sqrt(d)*1.4;
  if (n.type==="theme") return 4 + Math.sqrt(d)*2.4;
  if (n.type==="image") return 13;
  if (n.type==="person") return 4 + Math.sqrt(d)*1.2;
  if (n.type==="text") return 5.5;
  if (n.type==="quote"||n.type==="marginalia") return 4;
  return 3 + Math.sqrt(d);
}
function build(){
  const keep = new Set();
  DATA.nodes.forEach(n => { if (!visible[n.type]) return; if (n.stub && !showStubs && n.type!=="theme" && n.id!==selected) return; keep.add(n.id); });
  const nodes = DATA.nodes.filter(n=>keep.has(n.id)).map(n => Object.assign({r:radius(n)}, n));
  const links = DATA.edges.filter(e=>keep.has(e.source)&&keep.has(e.target)).map(e=>({source:e.source,target:e.target,w:e.w,field:e.field}));
  return {nodes, links};
}
function drawMark(sel){
  sel.each(function(d){
    const g = d3.select(this), col = `var(${TYPES[d.type].c})`;
    const fill = d.stub ? "var(--bg)" : col, stroke = d.stub ? col : "var(--bg)", dash = d.stub ? "2,2" : null;
    if (d.type==="field"){
      g.append("circle").attr("class","mark").attr("r",d.r).attr("fill","var(--bg)").attr("stroke",col).attr("stroke-width",2.2);
      g.append("circle").attr("r",2.5).attr("fill",col);
    } else if (d.type==="work"){
      const book = d.kind!=="article";
      g.append("rect").attr("class","mark").attr("width", book?d.r*1.3:d.r*1.9).attr("height", book?d.r*1.9:d.r*1.3)
        .attr("x", book?-d.r*.65:-d.r*.95).attr("y", book?-d.r*.95:-d.r*.65).attr("rx",1.5)
        .attr("fill",fill).attr("stroke",stroke).attr("stroke-width",1.5).attr("stroke-dasharray",dash);
    } else if (d.type==="image" && d.thumb){
      const id = "clip-"+Math.random().toString(36).slice(2,8), s = d.r*2;
      defs.append("clipPath").attr("id",id).append("rect").attr("x",-d.r).attr("y",-d.r).attr("width",s).attr("height",s).attr("rx",3);
      g.append("rect").attr("class","mark").attr("x",-d.r-1.5).attr("y",-d.r-1.5).attr("width",s+3).attr("height",s+3).attr("rx",4).attr("fill",col).attr("stroke","var(--bg)").attr("stroke-width",1.5);
      g.append("image").attr("href",d.thumb.src).attr("x",-d.r).attr("y",-d.r).attr("width",s).attr("height",s).attr("preserveAspectRatio","xMidYMid slice").attr("clip-path",`url(#${id})`);
    } else if (d.type==="text"){
      g.append("rect").attr("class","mark").attr("width",d.r*1.5).attr("height",d.r*1.5).attr("x",-d.r*.75).attr("y",-d.r*.75).attr("rx",1)
        .attr("transform","rotate(45)").attr("fill",fill).attr("stroke",stroke).attr("stroke-width",1.3).attr("stroke-dasharray",dash);
    } else if (d.type==="marginalia"){
      g.append("circle").attr("class","mark").attr("r",d.r).attr("fill","var(--bg)").attr("stroke",col).attr("stroke-width",1.6);
    } else {
      g.append("circle").attr("class","mark").attr("r",d.r).attr("fill",fill).attr("fill-opacity",d.stub?1:.92).attr("stroke",stroke).attr("stroke-width",1.3).attr("stroke-dasharray",dash);
    }
    g.append("text");
  });
}
function labelOn(d){ const k = deg.get(d.id)||0; return d.type==="field" || d.type==="work" || (d.type==="theme" && (!d.stub || k>=2)) || (d.type==="person" && k>=3) || d.id===selected; }
function render(){
  const [W,H] = size();
  svg.attr("viewBox", [-W/2,-H/2,W,H]);
  current = build();
  current.nodes.forEach(n => { const p = pos.get(n.id); if (p){ n.x=p.x; n.y=p.y; } });
  linkSel = gLinks.selectAll("line").data(current.links, l => (l.source.id||l.source)+"~"+(l.target.id||l.target))
    .join("line").attr("class","link").attr("stroke-width", l => .5 + l.w*.9).attr("stroke-opacity", l => .3 + l.w*.3);
  nodeSel = gNodes.selectAll("g.node").data(current.nodes, d=>d.id).join(enter => {
    const g = enter.append("g").attr("tabindex",0).attr("role","button"); drawMark(g); return g;
  });
  nodeSel.attr("class", d => "node " + d.type + (d.stub?" stub":"")).attr("aria-label", d => d.title);
  nodeSel.select("text").text(d => d.type==="image" ? "" : (d.title.length>42 ? d.title.slice(0,40)+"…" : d.title))
    .attr("x", d => d.r + 4).attr("y", 4).attr("display", d => labelOn(d) ? null : "none");
  nodeSel.on("click", (e,d) => select(d.id)).on("dblclick", (e,d) => { e.preventDefault(); centre(d); })
    .on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);} })
    .on("mouseenter", (e,d) => { if(!selected) highlight(d.id); d3.select(e.currentTarget).select("text").attr("display",null).text(d.title.length>42 ? d.title.slice(0,40)+"…" : d.title); })
    .on("mouseleave", (e,d) => { if(!selected) highlight(null); if(!labelOn(d)) d3.select(e.currentTarget).select("text").attr("display","none"); else if (d.type==="image") d3.select(e.currentTarget).select("text").text(""); })
    .call(d3.drag().on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
                   .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
                   .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  if (sim) sim.stop();
  sim = d3.forceSimulation(current.nodes)
    .force("link", d3.forceLink(current.links).id(d=>d.id).distance(l => (l.field==="field"||l.field==="parent") ? 90 : 30 + 40/(l.w+.4)).strength(l => l.field==="field" ? .35 : Math.min(.9,.2+l.w*.3)))
    .force("charge", d3.forceManyBody().strength(d => d.type==="field" ? -700 : d.type==="work" ? -240 : d.type==="theme" ? -160 : d.type==="image" ? -140 : -50 - d.r*6))
    .force("collide", d3.forceCollide(d => labelOn(d) ? Math.max(d.r + 10, 8 + Math.min(d.title.length, 34) * 2.1) : d.r + 5).strength(.8))
    .force("x", d3.forceX(0).strength(.045)).force("y", d3.forceY(0).strength(.07))
    .on("tick", () => { tick(); if (sim.alpha() < .25 && !fitted){ fitted = true; fit(true); } }).on("end", () => fit(true));
  fitted = false;
  if (reduce){ sim.stop(); for(let i=0;i<300;i++) sim.tick(); tick(); fit(false); }
  else sim.alpha(pos.size ? .5 : 1).restart();
  if (selected && !current.nodes.find(n=>n.id===selected)) selected = null;
  highlight(selected);
}
function fit(animate){
  if (userZoomed || !current.nodes.length) return;
  const [W,H] = size(), pad = 30;
  const xs = current.nodes.map(n=>n.x), ys = current.nodes.map(n=>n.y);
  const x0 = d3.min(xs)-20, x1 = d3.max(xs)+150, y0 = d3.min(ys)-20, y1 = d3.max(ys)+20;
  const k = Math.max(W < 600 ? .6 : .3, Math.min(1.6, (W-2*pad)/(x1-x0), (H-2*pad)/(y1-y0)));
  const tr = d3.zoomIdentity.scale(k).translate(-(x0+x1)/2, -(y0+y1)/2);
  (animate && !reduce ? svg.transition().duration(600) : svg).call(zoom.transform, tr);
}
function centre(d){ userZoomed = true; const t = d3.zoomTransform(svg.node()); svg.transition().duration(reduce?0:500).call(zoom.transform, d3.zoomIdentity.scale(Math.max(t.k,1.6)).translate(-d.x,-d.y)); }
function tick(){
  linkSel.attr("x1",l=>l.source.x).attr("y1",l=>l.source.y).attr("x2",l=>l.target.x).attr("y2",l=>l.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  current.nodes.forEach(n => pos.set(n.id,{x:n.x,y:n.y}));
}
function neighbors(id){
  const s = new Set([id]);
  current.links.forEach(l => { const a=l.source.id||l.source, b=l.target.id||l.target; if(a===id) s.add(b); if(b===id) s.add(a); });
  return s;
}
function highlight(id){
  if (!nodeSel) return;
  if (!id){ nodeSel.classed("dim",false).classed("hit",false).classed("sel",false); linkSel.classed("dim",false); return; }
  const nb = neighbors(id);
  nodeSel.classed("dim", d=>!nb.has(d.id)).classed("sel", d=>d.id===id).classed("hit",false);
  linkSel.classed("dim", l => (l.source.id!==id && l.target.id!==id));
  nodeSel.filter(d=>nb.has(d.id)).select("text").attr("display",null).text(d => d.title.length>42 ? d.title.slice(0,40)+"…" : d.title);
}

// ---------- panel ----------
const panel = document.getElementById("panel");
const col = t => `var(${TYPES[t].c})`;
const sw = n => `<span class="sw ${n.type}${n.stub||n.type==="marginalia"?" hollow":""}" style="--c:${col(n.type)}"></span>`;
function fieldTags(n){ return n.fields&&n.fields.length ? `<p class="byline" style="margin-top:8px">${n.fields.map(f=>`<button data-go="${esc(f)}">${esc(f)}</button>`).join(" · ")}</p>` : ""; }
function tagBtn(id){ const n = byId.get(id); if(!n) return ""; return `<button class="tag${n.proposed?" proposed":""}" style="--c:${col(n.type)}" data-go="${esc(id)}" title="${n.proposed?"proposed theme — not yet reviewed":""}">${esc(n.title)}</button>`; }
function row(n, right, why){
  return `<li><button data-go="${esc(n.id)}">${sw(n)}<span class="t">${n.type==="work"?`<i>${esc(n.title)}</i>`:esc(n.title)}${why?`<span class="why">${esc(why)}</span>`:""}</span><span class="r">${esc(right??"")}</span></button></li>`;
}
function coverHTML(n){
  const fb = `<div class="cover type" aria-hidden="true"><span>${esc(n.title)}</span><small>${esc((n.author||[]).join(", "))}</small></div>`;
  if (!n.cover) return fb;
  return `<div class="cover"><img src="${esc(n.cover)}" alt="Cover of ${esc(n.title)}"></div>`;
}
function picHTML(t, alt, small){ return t ? `<div class="pic${small?" small":""}"><img src="${esc(t.src)}" width="${t.w}" height="${t.h}" alt="${esc(alt)}"></div>` : ""; }
function grouped(id, exclude=[]){
  const groups = {};
  (nbrs.get(id)||[]).forEach(x => { const n = byId.get(x.id); if(!n||exclude.includes(n.type)) return; (groups[n.type] ||= []).push({n, field:x.field}); });
  const order = ["field","quote","marginalia","text","image","work","person","theme","imprint","honor","geo"];
  return order.filter(t=>groups[t]).map(t => {
    const items = groups[t]; const seen = new Set();
    const list = items.filter(x=>!seen.has(x.n.id)&&seen.add(x.n.id));
    if (t==="image") return `<h3>${TYPES[t].label}</h3><div class="thumbs">${list.map(x=>x.n.thumb?`<button data-go="${esc(x.n.id)}" title="${esc(x.n.title)}"><img src="${x.n.thumb.src}" alt="${esc(x.n.title)}"></button>`:`<button data-go="${esc(x.n.id)}">${esc(x.n.title)}</button>`).join("")}</div>`;
    return `<h3>${TYPES[t].label}</h3><ul class="rank">${list.map(x => {
      const n = x.n, why = n.type==="quote" ? n.quote : n.type==="text" ? (n.text||"").split("\n")[0] : n.type==="work" ? (n.author||[]).join(", ") : n.type==="person" ? (n.roles||[]).join(", ") : FIELD_LABEL[x.field]||"";
      const right = n.type==="quote"&&n.page ? "p. "+n.page : n.type==="work"&&n.year ? n.year : n.type==="text"&&n.date ? String(n.date).slice(0,4) : "";
      return row(n, right, why);
    }).join("")}</ul>`;
  }).join("");
}
function showHome(){
  const counts = {}; DATA.nodes.forEach(n => { if(!n.stub) counts[n.type]=(counts[n.type]||0)+1; });
  const recent = DATA.nodes.filter(n=>!n.stub && n.captured).sort((a,b)=>b.captured.localeCompare(a.captured)).slice(0,8);
  const themes = DATA.nodes.filter(n=>n.type==="theme").map(n=>({n,d:deg.get(n.id)||0})).sort((a,b)=>b.d-a.d||a.n.title.localeCompare(b.n.title)).slice(0,14);
  const reading = DATA.nodes.filter(n=>n.type==="work" && n.status==="reading");
  panel.innerHTML = `
    <p class="eyebrow">Camille's library</p>
    <h2>${written} notes, joined by what they share</h2>
    <p class="summary">Works are squares; the things kept from them — quotes, texts, images — are orange; people aqua; themes blue. Click anything to read it; the panel lists what it touches.</p>
    <div class="fields">${DATA.nodes.filter(n=>n.type==="field").sort((a,b)=>(a.parent?1:0)-(b.parent?1:0)||a.title.localeCompare(b.title)).map(n=>`<button data-go="${esc(n.id)}" class="${n.parent?"sub":""}">${esc(n.title)}</button>`).join("")}</div>
    <div class="shelf">${["work","quote","text","image","person","theme"].filter(t=>counts[t]).map(t=>`<button data-filter="${t}" style="--c:${col(t)}"><div class="big">${counts[t]}</div><div class="lab"><span class="sw"></span>${TYPES[t].label}</div></button>`).join("")}</div>
    ${reading.length?`<h3>Reading now</h3><ul class="rank">${reading.map(n=>row(n,n.started,(n.author||[]).join(", "))).join("")}</ul>`:""}
    <h3>Recently captured</h3>
    <ul class="rank">${recent.map(n=>row(n, n.captured, n.type==="quote"?n.quote:n.type==="work"?(n.author||[]).join(", "):n.type==="text"?(n.author||[]).join(", ")||n.kind:n.type==="image"?(n.creator||[]).join(", ")||n.kind:"")).join("")||"<li class='empty'>Nothing dated yet.</li>"}</ul>
    <h3>Themes by reach</h3>
    <div class="tags">${themes.map(x=>tagBtn(x.n.id)).join("")}</div>`;
}
function showWork(n){
  const rowd = (k,v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  const people = [["author",n.author],["tr.",n.translator],["ed.",n.editor]].filter(x=>x[1]&&x[1].length);
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    ${coverHTML(n)}
    <p class="eyebrow"><span class="dot" style="--c:${col("work")}"></span>${esc(n.kind)}${n.genre&&n.genre.length?" · "+esc(n.genre.join(" · ")):""}${n.status?` · ${esc(n.status)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${fieldTags(n)}
    <p class="byline">${people.map(([k,v])=>(k==="author"?"":k+" ")+v.map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")).join(" · ")}</p>
    ${n.firstLine ? `<blockquote class="quote">${esc(n.firstLine)}</blockquote>` : ""}
    ${n.summary ? `<p class="summary">${esc(n.summary)}</p>` : ""}
    <dl>${rowd("Publisher", n.publisher?`<button class="linkish" data-go="${esc(n.publisher)}">${esc(n.publisher)}</button>`:"")}${rowd("This edition", n.year?`<span class="mono">${esc(n.year)}</span>`:"")}${rowd("First published", esc(n.first))}${rowd("Pages", esc(n.pages))}${rowd("Language", esc(n.language))}${rowd("DOI", n.doi?`<a class="mono" href="https://doi.org/${esc(n.doi)}" target="_blank" rel="noopener">${esc(n.doi)}</a>`:"")}${rowd("ISBN", n.isbn?`<span class="mono">${esc(n.isbn)}</span>`:"")}${rowd("Started", esc(n.started))}${rowd("Finished", esc(n.finished))}</dl>
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","person"])}
    ${n.notes ? `<h3>Notes</h3><p class="prose">${esc(n.notes)}</p>` : ""}`;
}
function showQuote(n){
  const w = byId.get(n.work);
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col(n.type)}"></span>${n.type}${n.page?` · p. ${esc(n.page)}`:""}</p>
    ${fieldTags(n)}
    ${n.quote ? `<blockquote class="quote">${esc(n.quote)}</blockquote>` : ""}
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    ${w ? `<p class="attrib">from <button class="linkish" data-go="${esc(w.id)}"><i>${esc(w.title)}</i></button>${(w.author||[]).length?", "+esc(w.author.join(", ")):""}${w.year?" ("+esc(w.year)+")":""}</p>` : ""}
    ${picHTML(n.image, "capture", true)}
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","work"])}`;
}
function showText(n){
  const w = byId.get(n.work);
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("text")}"></span>${esc(n.kind||"text")}${n.date?` · ${esc(n.date)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${fieldTags(n)}
    <p class="byline">${(n.author||[]).map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}${(n.translator||[]).length?` · tr. ${n.translator.map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}`:""}</p>
    <div class="${n.kind==="poem"?"poem":"prose"}">${esc(n.text)}</div>
    ${n.source ? `<p class="attrib">${esc(n.source)}${n.sourceUrl?` · <a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">source</a>`:""}</p>` : ""}
    ${w ? `<p class="attrib">in <button class="linkish" data-go="${esc(w.id)}"><i>${esc(w.title)}</i></button></p>` : ""}
    ${n.via ? `<p class="attrib">via ${esc(n.via)}</p>` : ""}
    ${picHTML(n.image, "capture", true)}
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","person","work"])}`;
}
function showImage(n){
  const rowd = (k,v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  const w = byId.get(n.work);
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    ${picHTML(n.thumb, n.title)}
    <p class="eyebrow"><span class="dot" style="--c:${col("image")}"></span>${esc(n.kind||"image")}${n.date?` · ${esc(n.date)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${fieldTags(n)}
    <p class="byline">${(n.creator||[]).map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}</p>
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <dl>${rowd("Source", esc(n.source))}${rowd("Held at", n.institution?`<button class="linkish" data-go="${esc(n.institution)}">${esc(n.institution)}</button>${n.inventory?` · <span class="mono">${esc(n.inventory)}</span>`:""}`:"")}${rowd("Medium", esc(n.medium))}${rowd("Links", [n.sourceUrl?`<a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">source page</a>`:"", n.hires?`<a href="${esc(n.hires)}" target="_blank" rel="noopener">hi-res</a>`:""].filter(Boolean).join(" · "))}</dl>
    ${w ? `<p class="attrib">from <button class="linkish" data-go="${esc(w.id)}"><i>${esc(w.title)}</i></button></p>` : ""}
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","person","work"])}`;
}
function showPerson(n){
  const life = [n.born, n.died].filter(Boolean).join("–");
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("person")}"></span>${esc((n.roles||[]).join(" · ")||"person")}${life?` · ${esc(life)}`:""}${n.nationality?` · ${esc(n.nationality)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.stub ? `<p class="empty">Linked from other notes; no note of their own yet.</p>` : ""}
    ${fieldTags(n)}
    ${n.aliases&&n.aliases.length ? `<p class="byline">also ${esc(n.aliases.join(", "))}</p>` : ""}
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    ${grouped(n.id)}`;
}
function showField(n){
  const parent = n.parent ? byId.get(n.parent) : null;
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("field")}"></span>field${parent?` · within <button class="linkish" data-go="${esc(parent.id)}">${esc(parent.title)}</button>`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <p class="byline">${deg.get(n.id)||0} connections</p>
    ${grouped(n.id)}`;
}
function showTheme(n){
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("theme")}"></span>theme${n.parent&&byId.get(n.parent)?` · within <button class="linkish" data-go="${esc(n.parent)}">${esc(n.parent)}</button>`:""} ${n.proposed?`<span class="pill">proposed · review me</span>`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.stub ? `<p class="empty">Used as a link but has no theme note yet.</p>` : ""}
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <p class="byline">${deg.get(n.id)||0} ${(deg.get(n.id)||0)===1?"connection":"connections"}</p>
    ${grouped(n.id)}`;
}
function showPlain(n){
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col(n.type)}"></span>${esc(TYPES[n.type].label)}</p>
    <h2>${esc(n.title)}</h2>
    <p class="byline">${deg.get(n.id)||0} ${(deg.get(n.id)||0)===1?"connection":"connections"}</p>
    ${grouped(n.id)}`;
}
function select(id){
  selected = id;
  if (!id){ showHome(); highlight(null); return; }
  const n = byId.get(id); if (!n) return;
  ({field:showField, work:showWork, quote:showQuote, marginalia:showQuote, text:showText, image:showImage, person:showPerson, theme:showTheme}[n.type] || showPlain)(n);
  if (!current.nodes.find(x=>x.id===id)){
    if (!visible[n.type]){ visible[n.type]=true; const b = filtersEl.querySelector(".chip."+n.type); if (b) b.setAttribute("aria-pressed",true); save(); }
    render();
  }
  highlight(id);
  const cn = current.nodes.find(x=>x.id===id);
  if (cn && cn.x!=null){ svg.transition().duration(reduce?0:450).call(zoom.translateTo, cn.x, cn.y); }
  panel.scrollTop = 0;
}
panel.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) return select(go.dataset.go);
  if (e.target.closest("[data-home]")) return select(null);
  const f = e.target.closest("[data-filter]"); if (f){ const t=f.dataset.filter; Object.keys(visible).forEach(k=>visible[k]=(k===t||k==="work"&&t!=="work"?visible[k]:false)); visible[t]=true; buildFilters(); save(); render(); }
});
svg.on("click", e => { if (e.target === svg.node()) select(null); });
document.getElementById("fit").onclick = () => { userZoomed=false; fit(true); };
document.getElementById("clear").onclick = () => { Object.entries(TYPES).forEach(([k,v])=>visible[k]=v.on); showStubs=false; buildFilters(); save(); select(null); render(); };
document.addEventListener("keydown", e => { if (e.key==="Escape"){ select(null); document.getElementById("q").value=""; } });

// ---------- search ----------
const hay = new Map(DATA.nodes.map(n => [n.id, [n.title, n.quote, n.text, (n.author||[]).join(" "), (n.creator||[]).join(" "), n.source, n.summary, (n.aliases||[]).join(" ")].filter(Boolean).join(" ").toLowerCase()]));
const q = document.getElementById("q");
q.addEventListener("input", e => {
  const s = e.target.value.trim().toLowerCase();
  if (!s){ highlight(selected); return; }
  const hits = new Set(current.nodes.filter(n => hay.get(n.id).includes(s)).map(n=>n.id));
  nodeSel.classed("dim", d=>!hits.has(d.id)).classed("hit", d=>hits.has(d.id));
  nodeSel.filter(d=>hits.has(d.id)).select("text").attr("display",null).text(d => d.title.length>42 ? d.title.slice(0,40)+"…" : d.title);
  linkSel.classed("dim", true);
  const list = DATA.nodes.filter(n => hay.get(n.id).includes(s)).slice(0,30);
  panel.innerHTML = `<p class="eyebrow">Search</p><h2>${list.length} ${list.length===1?"match":"matches"}</h2><ul class="rank">${list.map(n=>row(n, TYPES[n.type].label, n.type==="quote"?n.quote:n.type==="text"?(n.text||"").split("\n")[0]:(n.author||n.creator||[]).join(", "))).join("")||"<li class='empty'>Nothing matches.</li>"}</ul>`;
});
q.addEventListener("keydown", e => { if (e.key!=="Enter") return; const s = q.value.trim().toLowerCase(); const n = DATA.nodes.find(n => hay.get(n.id).includes(s)); if (n) select(n.id); });
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(()=>{ const [W,H]=size(); svg.attr("viewBox",[-W/2,-H/2,W,H]); }, 150); });

showHome(); render();
</script>
