<title>Library Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen reading room — header strip, filter rail, graph left, reading panel right; stacks on phones.
   Color: ink for works; three validated hues — blue themes, orange captures (quotes, texts, images), aqua people;
   publishers / honors / places are muted and off by default. */
:root{
  --bg:#F4F1EA; --surface:#FBFAF6; --ink:#1F1D1A; --muted:#6B675F; --faint:#9A958B;
  --line:rgba(31,29,26,.12); --edge:rgba(31,29,26,.20); --wash:rgba(31,29,26,.05);
  --work:#1F1D1A; --theme:#2a78d6; --capture:#eb6834; --person:#1baf7a; --meta:#8E887C;
  --focus:#2a78d6;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-inline:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:14px 6px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:.005em}
.count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-block:6px 8px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:.78rem var(--f-body);cursor:pointer;padding:3px 2px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.work .sw{border-radius:1.5px;width:8px;height:11px}
.chip.field .sw{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.rank .sw.field{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fields button{all:unset;cursor:pointer;font-family:var(--f-display);font-size:1rem;padding:5px 12px;border:1.5px solid var(--ink);border-radius:999px}
.fields button:hover{background:var(--wash)}
.fields button.sub{font-size:.85rem;border-style:dashed;opacity:.85}
.chip.text .sw{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.chip.image .sw{border-radius:2px;width:11px;height:11px}
.chip.marginalia .sw,.chip.stub .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip[aria-pressed="false"]{color:var(--faint)}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip .n{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.sep{width:1px;height:14px;background:var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#graph canvas{display:block;cursor:grab}
#graph:active canvas{cursor:grabbing}
.force-graph-container .graph-tooltip{display:none}
.hint{position:absolute;left:0;bottom:8px;font-size:.7rem;color:var(--faint);pointer-events:none}
.ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.ctl button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 .75rem var(--f-body);padding:4px 9px;border-radius:6px;cursor:pointer}
.ctl button:hover{color:var(--ink)}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:16px 2px 28px 20px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
aside h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
aside h3{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:20px 0 8px}
.byline{color:var(--muted);margin:0}
.byline button,.linkish{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.byline button:hover,.linkish:hover{border-color:var(--ink)}
.cover{width:112px;aspect-ratio:2/3;max-width:100%;border-radius:2px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.14)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.type{display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:.8rem;line-height:1.2}
.cover.type small{font-family:var(--f-body);font-size:.6rem;opacity:.75}
.pic{margin:0 0 14px;border-radius:3px;overflow:hidden;background:var(--wash);box-shadow:0 1px 0 var(--line),0 8px 22px rgba(0,0,0,.14)}
.pic img{width:100%;height:auto;display:block}
.pic.small{width:140px}
.quote{font-family:var(--f-display);font-size:1.02rem;line-height:1.5;margin:12px 0 0;padding-left:12px;border-left:2px solid var(--capture);white-space:pre-wrap}
.poem{font-family:var(--f-display);font-size:1rem;line-height:1.55;margin:12px 0 0;white-space:pre-wrap}
.prose{margin:12px 0 0;max-width:60ch;white-space:pre-wrap}
.summary{margin:12px 0 0;max-width:62ch}
.attrib{color:var(--muted);font-size:.82rem;margin:8px 0 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:.82rem}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;font:.76rem var(--f-body);padding:3px 9px;cursor:pointer}
.tag:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.tag.proposed{border-style:dashed}
.pill{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}
ul.rank,ol.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 6px;border-radius:6px;cursor:pointer}
.rank button:hover,.rank button:focus-visible{background:var(--wash)}
.rank .sw{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.rank .sw.work{border-radius:1.5px;width:7px;height:10px}
.rank .sw.text{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.rank .sw.image{border-radius:2px;width:10px;height:10px}
.rank .sw.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.rank .t{min-width:0}
.rank .t i{font-style:italic}
.rank .why{display:block;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;margin-top:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{all:unset;cursor:pointer;border-radius:3px;overflow:hidden;background:var(--wash);aspect-ratio:1;display:block}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button:hover img{opacity:.85}
.back{all:unset;cursor:pointer;font-size:.78rem;color:var(--muted);margin-bottom:12px;display:inline-block}
.back:hover{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.shelf button{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.shelf button:hover{border-color:var(--c)}
.shelf .big{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.shelf .lab{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.shelf .lab .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.empty{color:var(--muted);font-size:.85rem}
a{color:inherit}
@media (max-width:760px){
  .app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  #graph{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:16px 0 32px}
  .tools{margin-left:0}
  input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* views */
.views{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);margin-right:6px}
.views button{border:0;background:none;color:var(--muted);font:500 .78rem var(--f-body);padding:4px 11px;border-radius:999px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.view{position:absolute;inset:0;overflow:auto;padding:14px 16px 24px 0;background:var(--bg)}
.view[hidden]{display:none}
.sortrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 12px;font-size:.78rem;color:var(--muted)}
.sortrow button{all:unset;cursor:pointer;color:var(--muted);padding:2px 0;border-bottom:1px solid transparent}
.sortrow button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.wall{columns:5 160px;column-gap:8px}
.wall button{all:unset;display:block;cursor:pointer;break-inside:avoid;margin:0 0 8px;border-radius:3px;overflow:hidden;background:var(--wash);position:relative}
.wall img{width:100%;height:auto;display:block}
.wall button:hover img{opacity:.88}
.wall .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:.7rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.wall button:hover .cap,.wall button:focus-visible .cap{opacity:1}
.wall .hue{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.index{columns:3 260px;column-gap:28px}
.index section{break-inside:avoid;margin:0 0 14px}
.index h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.3rem;font-weight:400;color:var(--faint)}
.index ul{list-style:none;margin:0;padding:0}
.index li button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:2px 0;max-width:100%}
.index li button:hover .t{border-bottom:1px solid var(--ink)}
.index .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.index .sw.work{border-radius:1px;width:6px;height:9px}
.index .sw.text{border-radius:1px;transform:rotate(45deg) translateY(-1px);width:7px;height:7px}
.index .sw.image{border-radius:2px;width:9px;height:9px}
.index .sw.field{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.index .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
.index .t i{font-style:italic}
.index .k{font-family:var(--f-mono);font-size:.62rem;color:var(--faint);flex:none}
.trails{display:grid;gap:10px;max-width:720px}
.trailcard{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.trailcard:hover{border-color:var(--ink)}
.trailcard h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0 0 4px;text-transform:none;letter-spacing:0;color:var(--ink)}
.trailcard p{margin:0;color:var(--muted);font-size:.85rem}
.trailcard .meta{font-family:var(--f-mono);font-size:.66rem;color:var(--faint);margin-top:8px;display:flex;gap:10px}
.stops{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;counter-reset:stop}
.stops li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.stops li::before{counter-increment:stop;content:counter(stop);font-family:var(--f-mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;margin-top:2px}
.stops li.on::before{background:var(--capture);color:#fff;border-color:var(--capture)}
.stops button{all:unset;cursor:pointer;display:block;padding:3px 6px;border-radius:6px}
.stops button:hover,.stops li.on button{background:var(--wash)}
.stops .t{display:block}
.stops .t i{font-style:italic}
.stops .n{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.player{display:flex;gap:6px;align-items:center;margin:12px 0 0}
.player button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .78rem var(--f-body);padding:5px 11px;border-radius:6px;cursor:pointer}
.player button:hover{border-color:var(--ink)}
.player .pos{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-left:auto}
.lvl{position:absolute;left:0;top:8px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);pointer-events:none}
@media (max-width:760px){.wall{columns:3 110px}.index{columns:1}}
</style>

<div class="app">
  <header>
    <h1>Library Constellation</h1>
    <span class="count" id="count"></span>
    <div class="tools">
      <div class="views" role="group" aria-label="View" id="views">
        <button type="button" data-view="graph" aria-pressed="true">Constellation</button>
        <button type="button" data-view="wall" aria-pressed="false">Wall</button>
        <button type="button" data-view="index" aria-pressed="false">Index</button>
        <button type="button" data-view="trails" aria-pressed="false">Trails</button>
      </div>
      <input type="search" id="q" placeholder="Search titles, people, quotes…" aria-label="Search the library">
    </div>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Show or hide node types"></div>
  <main>
    <div id="graph">
      <div id="fg" role="img" aria-label="Network of works, quotes, texts, images, people and themes"></div>
      <div class="lvl" id="lvl"></div>
      <div class="hint">Drag to pan · scroll to zoom in for detail · click to read</div>
      <div class="ctl"><button id="fit" type="button">Fit</button><button id="clear" type="button">Clear</button></div>
      <div class="view" id="wall" hidden></div>
      <div class="view" id="index" hidden></div>
      <div class="view" id="trailsview" hidden></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://unpkg.com/force-graph@1.52.0/dist/force-graph.min.js"></script>
<script>
const DATA = /*DATA*/null;
const TYPES = {
  field:{label:"Fields",c:"--work",on:true}, work:{label:"Works",c:"--work",on:true}, quote:{label:"Quotes",c:"--capture",on:true}, marginalia:{label:"Marginalia",c:"--capture",on:true},
  text:{label:"Texts",c:"--capture",on:true}, image:{label:"Images",c:"--capture",on:true},
  person:{label:"People",c:"--person",on:true}, theme:{label:"Themes",c:"--theme",on:true},
  imprint:{label:"Publishers & journals",c:"--meta",on:false}, honor:{label:"Honors",c:"--meta",on:false}, geo:{label:"Places & languages",c:"--meta",on:false}
};
const FIELD_LABEL = {field:"field",parent:"within",about:"about",themes:"theme",author:"author",translator:"translator",editor:"editor",creator:"creator",via:"via",work:"from",in:"in",publisher:"publisher",series:"series",institution:"held at",awards:"award",shortlists:"shortlist",published:"published in","original language":"language",related:"related"};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const deg = new Map();
DATA.edges.forEach(e => { deg.set(e.source,(deg.get(e.source)||0)+1); deg.set(e.target,(deg.get(e.target)||0)+1); });
const nbrs = new Map();
DATA.edges.forEach(e => { (nbrs.get(e.source)||nbrs.set(e.source,[]).get(e.source)).push({id:e.target,field:e.field}); (nbrs.get(e.target)||nbrs.set(e.target,[]).get(e.target)).push({id:e.source,field:e.field,rev:true}); });

// ---------- state ----------
let selected = null, showStubs = false, view = "graph", activeTrail = null, trailPos = 0, playing = null;
const visible = Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v.on]));
try { const s = JSON.parse(localStorage.getItem("lc2-filters")); if (s) Object.assign(visible, s); const st = localStorage.getItem("lc2-stubs"); if (st!==null) showStubs = st==="1"; } catch(e){}
const save = () => { try{ localStorage.setItem("lc2-filters", JSON.stringify(visible)); localStorage.setItem("lc2-stubs", showStubs?"1":"0"); }catch(e){} };

// ---------- filters ----------
const filtersEl = document.getElementById("filters");
function buildFilters(){
  filtersEl.innerHTML = "";
  Object.entries(TYPES).forEach(([t,info]) => {
    const n = DATA.nodes.filter(x=>x.type===t).length; if (!n) return;
    const b = document.createElement("button"); b.type="button";
    b.className = "chip "+t; b.style.setProperty("--c", `var(${info.c})`);
    b.innerHTML = `<span class="sw"></span>${info.label} <span class="n">${n}</span>`;
    b.setAttribute("aria-pressed", visible[t]);
    b.onclick = () => { visible[t] = !visible[t]; b.setAttribute("aria-pressed", visible[t]); save(); render(); renderView(); };
    filtersEl.appendChild(b);
  });
  const sep = document.createElement("span"); sep.className="sep"; filtersEl.appendChild(sep);
  const s = document.createElement("button"); s.type="button"; s.className="chip stub"; s.style.setProperty("--c","var(--meta)");
  const ns = DATA.nodes.filter(x=>x.stub).length;
  s.innerHTML = `<span class="sw"></span>Linked names without a note <span class="n">${ns}</span>`;
  s.setAttribute("aria-pressed", showStubs);
  s.onclick = () => { showStubs=!showStubs; s.setAttribute("aria-pressed", showStubs); save(); render(); };
  filtersEl.appendChild(s);
}
buildFilters();
const written = DATA.nodes.filter(n=>!n.stub).length;
document.getElementById("count").textContent = `${written} notes · ${DATA.trails.length} trails · built ${DATA.built}`;

// ---------- graph (canvas, force-graph) ----------
const el = document.getElementById("fg");
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {}; function readColors(){ C = {bg:cssv("--bg"), ink:cssv("--ink"), muted:cssv("--muted"), faint:cssv("--faint"), edge:cssv("--edge"), focus:cssv("--focus"), wash:cssv("--wash"),
  work:cssv("--work"), theme:cssv("--theme"), capture:cssv("--capture"), person:cssv("--person"), meta:cssv("--meta")}; }
readColors();
const colorOf = t => C[TYPES[t].c.slice(2)];
const thumbs = new Map();
DATA.nodes.forEach(n => { if (n.type==="image" && n.thumb){ const im = new Image(); im.src = n.thumb.src; thumbs.set(n.id, im); } });
let current = {nodes:[],links:[]}, nodeById = new Map(), userZoomed = false, hovered = null, searchHits = null, fitted = false, level = 0;
function radius(n){
  const d = deg.get(n.id)||0;
  if (n.type==="field") return 12 + Math.sqrt(d)*2.6;
  if (n.type==="work") return 7 + Math.sqrt(d)*1.4;
  if (n.type==="theme") return 4 + Math.sqrt(d)*2.4;
  if (n.type==="image") return 13;
  if (n.type==="person") return 4 + Math.sqrt(d)*1.2;
  if (n.type==="text") return 5.5;
  if (n.type==="quote"||n.type==="marginalia") return 4;
  return 3 + Math.sqrt(d);
}
function labelOn(d){ const k = deg.get(d.id)||0; return d.type==="field" || d.type==="work" || (d.type==="theme" && (!d.stub || k>=2)) || (d.type==="person" && k>=3) || d.id===selected; }

    <h2>${esc(n.title)}</h2>
    ${fieldTags(n)}
    <p class="byline">${(n.author||[]).map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}${(n.translator||[]).length?` · tr. ${n.translator.map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}`:""}</p>
    <div class="${n.kind==="poem"?"poem":"prose"}">${esc(n.text)}</div>
    ${n.source ? `<p class="attrib">${esc(n.source)}${n.sourceUrl?` · <a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">source</a>`:""}</p>` : ""}
    ${w ? `<p class="attrib">in <button class="linkish" data-go="${esc(w.id)}"><i>${esc(w.title)}</i></button></p>` : ""}
    ${n.via ? `<p class="attrib">via ${esc(n.via)}</p>` : ""}
    ${picHTML(n.image, "capture", true)}
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","person","work"])}`;
}
function showImage(n){
  const rowd = (k,v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  const w = byId.get(n.work);
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    ${picHTML(n.thumb, n.title)}
    <p class="eyebrow"><span class="dot" style="--c:${col("image")}"></span>${esc(n.kind||"image")}${n.date?` · ${esc(n.date)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${fieldTags(n)}
    <p class="byline">${(n.creator||[]).map(p=>`<button data-go="${esc(p)}">${esc(p)}</button>`).join(", ")}</p>
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <dl>${rowd("Source", esc(n.source))}${rowd("Held at", n.institution?`<button class="linkish" data-go="${esc(n.institution)}">${esc(n.institution)}</button>${n.inventory?` · <span class="mono">${esc(n.inventory)}</span>`:""}`:"")}${rowd("Medium", esc(n.medium))}${rowd("Links", [n.sourceUrl?`<a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">source page</a>`:"", n.hires?`<a href="${esc(n.hires)}" target="_blank" rel="noopener">hi-res</a>`:""].filter(Boolean).join(" · "))}</dl>
    ${w ? `<p class="attrib">from <button class="linkish" data-go="${esc(w.id)}"><i>${esc(w.title)}</i></button></p>` : ""}
    ${n.themes&&n.themes.length ? `<h3>Themes</h3><div class="tags">${n.themes.map(tagBtn).join("")}</div>` : ""}
    ${grouped(n.id, ["theme","person","work"])}`;
}
function showPerson(n){
  const life = [n.born, n.died].filter(Boolean).join("–");
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("person")}"></span>${esc((n.roles||[]).join(" · ")||"person")}${life?` · ${esc(life)}`:""}${n.nationality?` · ${esc(n.nationality)}`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.stub ? `<p class="empty">Linked from other notes; no note of their own yet.</p>` : ""}
    ${fieldTags(n)}
    ${n.aliases&&n.aliases.length ? `<p class="byline">also ${esc(n.aliases.join(", "))}</p>` : ""}
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    ${grouped(n.id)}`;
}
function showField(n){
  const parent = n.parent ? byId.get(n.parent) : null;
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("field")}"></span>field${parent?` · within <button class="linkish" data-go="${esc(parent.id)}">${esc(parent.title)}</button>`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <p class="byline">${deg.get(n.id)||0} connections</p>
    ${grouped(n.id)}`;
}
function showTheme(n){
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("theme")}"></span>theme${n.parent&&byId.get(n.parent)?` · within <button class="linkish" data-go="${esc(n.parent)}">${esc(n.parent)}</button>`:""} ${n.proposed?`<span class="pill">proposed · review me</span>`:""}</p>
    <h2>${esc(n.title)}</h2>
    ${n.stub ? `<p class="empty">Used as a link but has no theme note yet.</p>` : ""}
    ${n.text ? `<p class="prose">${esc(n.text)}</p>` : ""}
    <p class="byline">${deg.get(n.id)||0} ${(deg.get(n.id)||0)===1?"connection":"connections"}</p>
    ${grouped(n.id)}`;
}
function showPlain(n){
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow"><span class="dot" style="--c:${col(n.type)}"></span>${esc(TYPES[n.type].label)}</p>
    <h2>${esc(n.title)}</h2>
    <p class="byline">${deg.get(n.id)||0} ${(deg.get(n.id)||0)===1?"connection":"connections"}</p>
    ${grouped(n.id)}`;
}

// ---------- trails ----------
function showTrail(t){
  const stop = t.stops[trailPos];
  panel.innerHTML = `
    <button class="back" data-trails>← Trails</button>
    <p class="eyebrow"><span class="dot" style="--c:${col("quote")}"></span>trail · ${t.stops.length} stops${t.status==="draft"?` <span class="pill">draft</span>`:""}</p>
    <h2>${esc(t.title)}</h2>
    ${t.summary ? `<p class="summary">${esc(t.summary)}</p>` : ""}
    ${t.intro ? `<p class="prose" style="font-size:.9rem">${esc(t.intro)}</p>` : ""}
    <div class="player"><button type="button" data-step="-1">← Prev</button><button type="button" data-step="1">Next →</button><button type="button" data-play>${playing?"Pause":"Play"}</button><span class="pos">${trailPos+1} / ${t.stops.length}</span></div>
    <ol class="stops">${t.stops.map((s,i) => { const n = byId.get(s.id); return `<li class="${i===trailPos?"on":""}"><button data-stop="${i}"><span class="t">${n && n.type==="work" ? `<i>${esc(n.title)}</i>` : esc(n ? n.title : s.id)}</span>${s.note?`<span class="n">${esc(s.note)}</span>`:""}</button></li>`; }).join("")}</ol>
    ${stop ? `<h3>Stop ${trailPos+1}</h3><div id="stopdetail"></div>` : ""}`;
  if (stop){ const n = byId.get(stop.id); if (n){ const tmp = document.createElement("div"); renderNode(n, tmp); document.getElementById("stopdetail").innerHTML = tmp.innerHTML.replace(/<button class="back"[^>]*>[^<]*<\/button>/, ""); } }
}
function renderNode(n, target){
  const prev = panel.innerHTML; ({field:showField, work:showWork, quote:showQuote, marginalia:showQuote, text:showText, image:showImage, person:showPerson, theme:showTheme}[n.type] || showPlain)(n);
  target.innerHTML = panel.innerHTML; panel.innerHTML = prev;
}
function startTrail(t, pos=0){
  activeTrail = t; trailPos = pos; trailSet = new Set(t.stops.map(s=>s.id)); selected = null; searchHits = null;
  setView("graph", true);
  // make sure every stop's type is visible
  let changed = false; t.stops.forEach(s => { const n = byId.get(s.id); if (n && !visible[n.type]){ visible[n.type] = true; changed = true; } });
  if (changed){ buildFilters(); save(); render(); }
  recomputeFocus(); showTrail(t); goStop(pos);
}
function goStop(i){
  if (!activeTrail) return; const t = activeTrail; trailPos = Math.max(0, Math.min(t.stops.length-1, i));
  selected = t.stops[trailPos].id; recomputeFocus(); showTrail(t);
  const n = nodeById.get(selected); if (n) centreOn(selected, 1.8); else { render(); setTimeout(()=>centreOn(selected, 1.8), 900); }
}
function stopTrail(){ activeTrail = null; trailSet = new Set(); if (playing){ clearInterval(playing); playing = null; } selected = null; recomputeFocus(); }
function togglePlay(){ if (playing){ clearInterval(playing); playing = null; } else { playing = setInterval(() => { if (!activeTrail) return; if (trailPos >= activeTrail.stops.length-1){ clearInterval(playing); playing = null; showTrail(activeTrail); return; } goStop(trailPos+1); }, 6000); } if (activeTrail) showTrail(activeTrail); }
function showTrailsHome(){
  const tv = document.getElementById("trailsview");
  tv.innerHTML = `<p class="eyebrow">Trails</p><h2 style="font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 6px">${DATA.trails.length} walks through the library</h2><p class="summary" style="margin:0 0 14px">A trail is an ordered path with a sentence at each stop. Pick one and the constellation dims to the path; Play steps through it.</p>
    <div class="trails">${DATA.trails.map(t => `<button class="trailcard" data-trail="${esc(t.id)}"><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p><div class="meta"><span>${t.stops.length} stops</span>${t.fields.map(f=>`<span>${esc(f)}</span>`).join("")}${t.status==="draft"?"<span>draft</span>":""}</div></button>`).join("")}</div>`;
}

// ---------- wall & index ----------
let wallSort = "theme";
function showWall(){
  const w = document.getElementById("wall");
  let imgs = DATA.nodes.filter(n => n.type==="image" && n.thumb);
  const year = s => { const m = String(s||"").match(/\d{3,4}/); return m ? +m[0] : 9999; };
  if (wallSort==="hue") imgs.sort((a,b) => ((a.thumb.sat<.12?999:a.thumb.hue)-(b.thumb.sat<.12?999:b.thumb.hue)) || (b.thumb.light-a.thumb.light));
  else if (wallSort==="date") imgs.sort((a,b) => year(a.date)-year(b.date));
  else imgs.sort((a,b) => ((a.themes||[])[0]||"~").localeCompare((b.themes||[])[0]||"~") || a.title.localeCompare(b.title));
  w.innerHTML = `<div class="sortrow"><span>Sort by</span>${["theme","date","hue"].map(s=>`<button type="button" data-sort="${s}" aria-pressed="${wallSort===s}">${s}</button>`).join("")}<span style="margin-left:auto">${imgs.length} images</span></div>
    <div class="wall">${imgs.map(n => `<button data-go="${esc(n.id)}" title="${esc(n.title)}"><img src="${n.thumb.src}" width="${n.thumb.w}" height="${n.thumb.h}" alt="${esc(n.title)}" loading="lazy">${n.thumb.hue!=null?`<span class="hue" style="background:hsl(${n.thumb.hue} ${Math.round(n.thumb.sat*100)}% ${Math.round(40+n.thumb.light*30)}%)"></span>`:""}<span class="cap">${esc(n.title)}${n.date?` · ${esc(n.date)}`:""}</span></button>`).join("")}</div>`;
}
function showIndex(){
  const ix = document.getElementById("index");
  const items = DATA.nodes.filter(n => !n.stub && visible[n.type]).sort((a,b) => a.title.localeCompare(b.title, undefined, {sensitivity:"base"}));
  const groups = new Map();
  items.forEach(n => { const L = (n.title.replace(/^(the|a|an)\s+/i,"")[0]||"#").toUpperCase(); const key = /[A-Z]/.test(L) ? L : "#"; (groups.get(key)||groups.set(key,[]).get(key)).push(n); });
  ix.innerHTML = `<div class="sortrow"><span>${items.length} entries · articles dropped for sorting · use the type chips above to narrow</span></div><div class="index">${[...groups.keys()].sort().map(k => `<section><h3>${k}</h3><ul>${groups.get(k).map(n => `<li><button data-go="${esc(n.id)}"><span class="sw ${n.type}" style="--c:${col(n.type)}"></span><span class="t">${n.type==="work"?`<i>${esc(n.title)}</i>`:esc(n.title)}</span><span class="k">${esc(n.kind||n.type)}</span></button></li>`).join("")}</ul></section>`).join("")}</div>`;
}
function setView(v, keepPanel){
  view = v;
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view===v));
  document.getElementById("wall").hidden = v!=="wall"; document.getElementById("index").hidden = v!=="index"; document.getElementById("trailsview").hidden = v!=="trails";
  document.querySelector("#graph .hint").hidden = v!=="graph"; document.querySelector("#graph .ctl").hidden = v!=="graph"; document.getElementById("lvl").hidden = v!=="graph";
  renderView();
  if (v==="trails" && !keepPanel && !activeTrail) showHome();
}
function renderView(){ if (view==="wall") showWall(); else if (view==="index") showIndex(); else if (view==="trails") showTrailsHome(); }
document.getElementById("views").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
document.getElementById("wall").addEventListener("click", e => { const s = e.target.closest("[data-sort]"); if (s){ wallSort = s.dataset.sort; showWall(); return; } const go = e.target.closest("[data-go]"); if (go) select(go.dataset.go, true); });
document.getElementById("index").addEventListener("click", e => { const go = e.target.closest("[data-go]"); if (go) select(go.dataset.go, true); });
document.getElementById("trailsview").addEventListener("click", e => { const t = e.target.closest("[data-trail]"); if (t){ const tr = DATA.trails.find(x=>x.id===t.dataset.trail); if (tr) startTrail(tr); } });

// ---------- select ----------
function select(id, stay){
  if (activeTrail && !(id && trailSet.has(id))) stopTrail();
  selected = id;
  if (!id){ showHome(); searchHits = null; recomputeFocus(); return; }
  const n = byId.get(id); if (!n) return;
  if (activeTrail){ const i = activeTrail.stops.findIndex(s=>s.id===id); if (i>=0){ goStop(i); return; } }
  ({field:showField, work:showWork, quote:showQuote, marginalia:showQuote, text:showText, image:showImage, person:showPerson, theme:showTheme}[n.type] || showPlain)(n);
  if (!nodeById.has(id)){
    if (!visible[n.type]){ visible[n.type]=true; const b = filtersEl.querySelector(".chip."+n.type); if (b) b.setAttribute("aria-pressed",true); save(); }
    render();
  }
  searchHits = null; recomputeFocus();
  if (!stay){ setTimeout(() => centreOn(id), nodeById.get(id) && nodeById.get(id).x!=null ? 0 : 900); }
  panel.scrollTop = 0;
}
panel.addEventListener("click", e => {
  const tg = e.target.closest("[data-trail-go]"); if (tg){ const tr = DATA.trails.find(x=>x.id===tg.dataset.trailGo); if (tr) startTrail(tr); return; }
  const st = e.target.closest("[data-stop]"); if (st) return goStop(+st.dataset.stop);
  const sp = e.target.closest("[data-step]"); if (sp) return goStop(trailPos + (+sp.dataset.step));
  if (e.target.closest("[data-play]")) return togglePlay();
  if (e.target.closest("[data-trails]")){ stopTrail(); setView("trails"); showHome(); return; }
  const go = e.target.closest("[data-go]"); if (go){ if (view!=="graph" && view!=="trails") { /* stay in wall/index */ } else setView("graph", true); return select(go.dataset.go, view==="wall"||view==="index"); }
  if (e.target.closest("[data-home]")) return select(null);
  const f = e.target.closest("[data-filter]"); if (f){ const t=f.dataset.filter; Object.keys(visible).forEach(k=>visible[k]=(k===t||k==="work"||k==="field")); buildFilters(); save(); render(); renderView(); }
  const tl = e.target.closest("[data-opentrails]"); if (tl) setView("trails");
});
document.getElementById("fit").onclick = () => fit();
document.getElementById("clear").onclick = () => { Object.entries(TYPES).forEach(([k,v])=>visible[k]=v.on); showStubs=false; buildFilters(); save(); stopTrail(); select(null); render(); };
document.addEventListener("keydown", e => { if (e.key==="Escape"){ stopTrail(); select(null); document.getElementById("q").value=""; } if (activeTrail && e.key==="ArrowRight") goStop(trailPos+1); if (activeTrail && e.key==="ArrowLeft") goStop(trailPos-1); });

// ---------- search ----------
const hay = new Map(DATA.nodes.map(n => [n.id, [n.title, n.quote, n.text, (n.author||[]).join(" "), (n.creator||[]).join(" "), n.source, n.summary, (n.aliases||[]).join(" ")].filter(Boolean).join(" ").toLowerCase()]));
const q = document.getElementById("q");
q.addEventListener("input", e => {
  const s = e.target.value.trim().toLowerCase();
  if (!s){ searchHits = null; recomputeFocus(); if (!selected) showHome(); return; }
  if (activeTrail) stopTrail();
  searchHits = new Set(DATA.nodes.filter(n => hay.get(n.id).includes(s)).map(n=>n.id)); recomputeFocus();
  const list = DATA.nodes.filter(n => hay.get(n.id).includes(s)).slice(0,30);
  panel.innerHTML = `<p class="eyebrow">Search</p><h2>${list.length} ${list.length===1?"match":"matches"}</h2><ul class="rank">${list.map(n=>row(n, TYPES[n.type].label, n.type==="quote"?n.quote:n.type==="text"?(n.text||"").split("\n")[0]:(n.author||n.creator||[]).join(", "))).join("")||"<li class='empty'>Nothing matches.</li>"}</ul>`;
});
q.addEventListener("keydown", e => { if (e.key!=="Enter") return; const s = q.value.trim().toLowerCase(); const n = DATA.nodes.find(n => hay.get(n.id).includes(s)); if (n) select(n.id); });

showHome(); render();
</script>
