<title>Library Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen reading room — header strip, filter rail, graph left, reading panel right; stacks on phones.
   Color: ink for works; three validated hues — blue themes, orange captures (quotes, texts, images), aqua people;
   publishers / honors / places are muted and off by default. */
:root{
  --bg:#F4F1EA; --surface:#FBFAF6; --ink:#1F1D1A; --muted:#6B675F; --faint:#9A958B;
  --line:rgba(31,29,26,.12); --edge:rgba(31,29,26,.20); --wash:rgba(31,29,26,.05);
  --work:#1F1D1A; --theme:#2a78d6; --capture:#eb6834; --person:#1baf7a; --meta:#8E887C;
  --focus:#2a78d6;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1C1F25; --ink:#ECE9E1; --muted:#A5A196; --faint:#6F6C64;
  --line:rgba(236,233,225,.12); --edge:rgba(236,233,225,.18); --wash:rgba(236,233,225,.06);
  --work:#ECE9E1; --theme:#3987e5; --capture:#d95926; --person:#199e70; --meta:#7D786E; --focus:#7FA2FF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-inline:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:14px 6px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:.005em}
.count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-block:4px 8px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:.78rem var(--f-body);cursor:pointer;padding:3px 2px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.work .sw{border-radius:1.5px;width:8px;height:11px}
.chip.field .sw{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.rank .sw.field{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fields button{all:unset;cursor:pointer;font-family:var(--f-display);font-size:1rem;padding:5px 12px;border:1.5px solid var(--ink);border-radius:999px}
.fields button:hover{background:var(--wash)}
.fields button.sub{font-size:.85rem;border-style:dashed;opacity:.85}
.chip.text .sw{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.chip.image .sw{border-radius:2px;width:11px;height:11px}
.chip.marginalia .sw,.chip.stub .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip[aria-pressed="false"]{color:var(--faint)}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip .n{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.sep{width:1px;height:14px;background:var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#graph canvas{display:block;cursor:grab}
#graph:active canvas{cursor:grabbing}
.force-graph-container .graph-tooltip{display:none}
.hint{position:absolute;left:0;bottom:8px;font-size:.7rem;color:var(--faint);pointer-events:none}
.ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.ctl button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 .75rem var(--f-body);padding:4px 9px;border-radius:6px;cursor:pointer}
.ctl button:hover{color:var(--ink)}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:16px 2px 28px 20px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
aside h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
aside h3{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:20px 0 8px}
.byline{color:var(--muted);margin:0}
.byline button,.linkish{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.byline button:hover,.linkish:hover{border-color:var(--ink)}
.cover{width:112px;aspect-ratio:2/3;max-width:100%;border-radius:2px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.14)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.type{display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:.8rem;line-height:1.2}
.cover.type small{font-family:var(--f-body);font-size:.6rem;opacity:.75}
.pic{margin:0 0 14px;border-radius:3px;overflow:hidden;background:var(--wash);box-shadow:0 1px 0 var(--line),0 8px 22px rgba(0,0,0,.14)}
.pic img{width:100%;height:auto;display:block}
.pic.small{width:140px}
.quote{font-family:var(--f-display);font-size:1.02rem;line-height:1.5;margin:12px 0 0;padding-left:12px;border-left:2px solid var(--capture);white-space:pre-wrap}
.poem{font-family:var(--f-display);font-size:1rem;line-height:1.55;margin:12px 0 0;white-space:pre-wrap}
.prose{margin:12px 0 0;max-width:60ch;white-space:pre-wrap}
.summary{margin:12px 0 0;max-width:62ch}
.attrib{color:var(--muted);font-size:.82rem;margin:8px 0 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:.82rem}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;font:.76rem var(--f-body);padding:3px 9px;cursor:pointer}
.tag:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.tag.proposed{border-style:dashed}
.pill{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}
ul.rank,ol.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 6px;border-radius:6px;cursor:pointer}
.rank button:hover,.rank button:focus-visible{background:var(--wash)}
.rank .sw{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.rank .sw.work{border-radius:1.5px;width:7px;height:10px}
.rank .sw.text{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.rank .sw.image{border-radius:2px;width:10px;height:10px}
.rank .sw.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.rank .t{min-width:0}
.rank .t i{font-style:italic}
.rank .why{display:block;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;margin-top:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{all:unset;cursor:pointer;border-radius:3px;overflow:hidden;background:var(--wash);aspect-ratio:1;display:block}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button:hover img{opacity:.85}
.back{all:unset;cursor:pointer;font-size:.78rem;color:var(--muted);margin-bottom:12px;display:inline-block}
.back:hover{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.shelf button{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.shelf button:hover{border-color:var(--c)}
.shelf .big{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.shelf .lab{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.shelf .lab .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.empty{color:var(--muted);font-size:.85rem}
a{color:inherit}
@media (max-width:760px){
  .app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  #graph{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:16px 0 32px}
  .tools{margin-left:0}
  input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

he two pages:\n\nQuotes\n\nMarginalia"},{"id":"Power and political economy","type":"theme","title":"Power and political economy","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"proposed":false,"text":"Who rules, who pays, who is looked after: sovereignty, pastoral care, law, labour, capital.","parent":"","aliases":["power","political economy"]},{"id":"Pastoral power","type":"theme","title":"Pastoral power","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"proposed":true,"text":"Foucault's term for a power that looks after each individual and knows their conscience; the shepherd and the flock, and its secular heirs (medicine, welfare, the employer).","parent":"Power and political economy","aliases":[]},{"id":"Michel Foucault","type":"person","title":"Michel Foucault","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"roles":["author"],"born":"1926","died":"1984","nationality":"French","aliases":[],"text":""},{"id":"Leslie Sawyer","type":"person","title":"Leslie Sawyer","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"roles":["translator"],"born":"","died":"","nationality":"","aliases":[],"text":""},{"id":"Critical Inquiry","type":"imprint","title":"Critical Inquiry","stub":true},{"id":"University of Chicago Press","type":"imprint","title":"University of Chicago Press","stub":true},{"id":"French","type":"geo","title":"French","stub":true},{"id":"The schizophrenic's vulnerability to the therapist's unconscious processes","type":"work","title":"The schizophrenic's vulnerability to the therapist's unconscious processes","stub":false,"kind":"article","captured":"","publish":false,"themes":["The clinic","Psychiatry","Schizophrenia"],"fields":["psychoanalysis"],"author":["Harold F. Searles"],"translator":[],"editor":[],"publisher":"Journal of Nervous and Mental Disease","year":1958,"first":"","language":"English","isbn":"","pages":"247–262","doi":"10.1097/00005053-195809000-00006","url":"https://pubmed.ncbi.nlm.nih.gov/13588380/","status":"reference","started":"","finished":"","firstLine":"","summary":"Schizophrenic experience consists, surprisingly often, in the patient's responding to other people's unconscious processes — introjection as well as projection. Reprinted in Searles, Collected Papers on Schizophrenia and Related Subjects (1965) and in Wolstein, ed., Essential Papers on Countertransference (ch. 12).","genre":[],"cover":null,"notes":"Notes\n\nPMID 13588380. Page range from the journal issue (September 1958); confirm against the PDF.\n\nQuotes\n\nMarginalia"},{"id":"Schizophrenia","type":"theme","title":"Schizophrenia","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"proposed":false,"text":"The diagnosis and its literature — Searles's patients, the voices, the ego-boundary.","parent":"Psychiatry","aliases":["schizophrenic","psychosis"]},{"id":"Harold F. Searles","type":"person","title":"Harold F. Searles","stub":false,"captured":"","publish":false,"themes":["Schizophrenia","Psychiatry"],"fields":["psychoanalysis"],"roles":["author"],"born":"1918","died":"2015","nationality":"American","aliases":["Harold Searles"],"text":""},{"id":"Journal of Nervous and Mental Disease","type":"imprint","title":"Journal of Nervous and Mental Disease","stub":true},{"id":"Transitional Objects and Transitional Phenomena","type":"work","title":"Transitional Objects and Transitional Phenomena","stub":false,"kind":"article","captured":"","publish":false,"themes":["Family","The clinic"],"fields":["psychoanalysis"],"author":["D. W. Winnicott"],"translator":[],"editor":[],"publisher":"Tavistock Publications","year":1971,"first":"","language":"English","isbn":"","pages":"1–25","doi":"","url":"","status":"reference","started":"","finished":"","firstLine":"","summary":"Chapter 1 of Playing and Reality: the 1951 hypothesis of the transitional object, followed by two clinical examples — the boy with string (1955), and a woman's dependence on her mother.","genre":["chapter"],"cover":null,"notes":"Notes\n\nRead from a PDF extract of chapter 1 (18 pp., no printed page numbers — the page range above is the 1971 Tavistock pagination and should be verified). The string case was first published as “String: A Technique of Communication” (1960).\n\nQuotes\n\nMarginalia"},{"id":"Family","type":"theme","title":"Family","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"proposed":false,"text":"Mothers, fathers, children, inheritance.","parent":"","aliases":["kinship"]},{"id":"D. W. Winnicott","type":"person","title":"D. W. Winnicott","stub":false,"captured":"","publish":false,"themes":[],"fields":["psychoanalysis"],"roles":["author"],"born":"1896","died":"1971","nationality":"British","aliases":["Donald Winnicott"],"text":"Paediatrician and psychoanalyst, Paddington Green Children's Hospital."},{"id":"Playing and Reality","type":"imprint","title":"Playing and Reality","stub":true},{"id":"Tavistock Publications","type":"imprint","title":"Tavistock Publications","stub":true},{"id":"Yellowing Citrus Leaves in Spring, Summer and Fall","type":"work","title":"Yellowing Citrus Leaves in Spring, Summer and Fall","stub":false,"kind":"article","captured":"","publish":false,"themes":["Trees and gardening"],"fields":[],"author":["Master Gardeners of Alameda County"],"translator":[],"editor":[],"publisher":"UC Agriculture and Natural Resources","year":null,"first":"","language":"English","isbn":"","pages":"","doi":"","url":"https://ucanr.edu/blog/over-fence-alameda-county/article/yellowing-citrus-leaves-spring-summer-and-fall-what-do","status":"reference","started":"","finished":"","firstLine":"","summary":"Help Desk post: yellow citrus leaves are normal in winter but a signal otherwise — alkaline soil (pH above 7.5), waterlogging, cold roots, or deficiency. Iron shows as yellow leaves with green veins on young growth; nitrogen as uniform yellowing on old leaves. Fix watering first, add compost, soil-test before fertilising, and feed nitrogen February–June.","genre":["gardening"],"cover":null,"notes":"Notes\n\nDate not shown on the post. Pairs with the UC IPM identification page.\n\nQuotes\n\nMarginalia"},{"id":"Master Gardeners of Alameda County","type":"person","title":"Master Gardeners of Alameda County","stub":true},{"id":"Over the Fence (Alameda County)","type":"imprint","title":"Over the Fence (Alameda County)","stub":true},{"id":"Ferenczi — traumatic aloneness","type":"quote","title":"Ferenczi — traumatic aloneness","stub":false,"captured":"2026-10-05","publish":false,"themes":["The clinic","Emotion"],"fields":["psychoanalysis"],"work":"The Clinical Diary of Sándor Ferenczi","page":193,"edition":1988,"speaker":"","quote":"Traumatic aloneness is what really renders the attack traumatic, that is, causing the psyche to crack. The being left alone like this must help himself, and for this he must split himself into one who helps and one who is helped.","text":"— Sándor Ferenczi, *The Clinical Diary* (1932), ed. Judith Dupont, trans. Balint & Jackson (Harvard University Press, 1988), p. 193\n\nhttps://archive.org/details/clinicaldiaryofs00fere","image":null},{"id":"The Clinical Diary of Sándor Ferenczi","type":"work","title":"The Clinical Diary of Sándor Ferenczi","stub":true},{"id":"Foucault — a knowledge of the conscience","type":"quote","title":"Foucault — a knowledge of the conscience","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power","Autobiography and the self"],"fields":[],"work":"The Subject and Power","page":783,"edition":1982,"speaker":"","quote":"It implies a knowledge of the conscience and an ability to direct it.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 783","image":null},{"id":"Foucault — an individualizing tactic","type":"quote","title":"Foucault — an individualizing tactic","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power","Labor and capitalism"],"fields":[],"work":"The Subject and Power","page":784,"edition":1982,"speaker":"","quote":"… there was an individualizing “tactic” which characterized a series of powers: those of the family, medicine, psychiatry, education, and employers.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 784","image":null},{"id":"Foucault — organized itself as a church","type":"quote","title":"Foucault — organized itself as a church","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power"],"fields":[],"work":"The Subject and Power","page":783,"edition":1982,"speaker":"","quote":"Christianity is the only religion which has organized itself as a church. And as such, it postulates in principle that certain individuals can, by their religious quality, serve others … as pastors.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 783","image":null},{"id":"Foucault — pastoral power sacrifices itself for the flock","type":"quote","title":"Foucault — pastoral power sacrifices itself for the flock","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power"],"fields":[],"work":"The Subject and Power","page":783,"edition":1982,"speaker":"","quote":"Pastoral power is not merely a form of power which commands; it must also be prepared to sacrifice itself for the life and salvation of the flock.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 783","image":null},{"id":"Foucault — salvation in this world","type":"quote","title":"Foucault — salvation in this world","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power"],"fields":[],"work":"The Subject and Power","page":784,"edition":1982,"speaker":"","quote":"It was no longer a question of leading people to their salvation in the next world but rather ensuring it in this world. And in this context, the word “salvation” takes on different meanings: health, well-being …, security, protection against accidents.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 784","image":null},{"id":"Foucault — the state as a modern matrix of individualization","type":"quote","title":"Foucault — the state as a modern matrix of individualization","stub":false,"captured":"2026-10-05","publish":false,"themes":["Pastoral power"],"fields":[],"work":"The Subject and Power","page":783,"edition":1982,"speaker":"","quote":"In a way, we can see the state as a modern matrix of individualization or a new form of pastoral power.","text":"— Michel Foucault, *The Subject and Power* (Critical Inquiry, 1982), p. 783","image":null},{"id":"Jung — if I have to suffer, let it be from my reality","type":"quote","title":"Jung — if I have to suffer, let it be from my reality","stub":false,"captured":"2026-10-05","publish":false,"themes":["Autobiography and the self"],"fields":["psychoanalysis"],"work":"Memories, Dreams, Reflections","page":15,"edition":null,"speaker":"","quote":"People do not realize just how much they are putting at risk when they don't accept what life presents them with, the questions and tasks that life sets them. When they resolve to spare themselves the pain and suffering they owe to their nature, in so doing they refuse to pay life's dues, and for this very reason life then often leads them astray. If we don't accept our own destiny, a different kind of suffering takes its place: a neurosis develops, and I believe that the life which we have to live is not as bad as a neurosis. If I have to suffer, then let it be from my reality. A neurosis is a much greater curse! In general, a neurosis is a replacement for an evasion, an unconscious desire to cheat life, to avoid something. One cannot do more than live what one really is. And we are all made up of opposites and conflicting tendencies. After much reflection, I have come to the conclusion that it is better to live what one really is and accept the difficulties that arise as a result — because avoidance is much worse.","text":"— C. G. Jung, attributed to *Memories, Dreams, Reflections*, p. 15 — **attribution checked and wrong**\n\nChecked 2026-10-05 against the full text of the 1963 Collins/Routledge edition (OCR, 370 pp.): none of the passage's phrases (“greater curse”, “cheat life”, “putting at risk”, “what one really is”) occur anywhere in the book. The attribution is wrong. The closest canonical Jung is CW 11, *Psychology and Religion*, §129: neurosis as “a substitute for legitimate suffering.” The wording reads lik…","image":null},{"id":"Searles — responding to other persons' unconscious processes","type":"quote","title":"Searles — responding to other persons' unconscious processes","stub":false,"captured":"2026-10-05","publish":false,"themes":["Schizophrenia"],"fields":["psychoanalysis"],"work":"The schizophrenic's vulnerability to the therapist's unconscious processes","page":247,"edition":1958,"speaker":"","quote":"After several years of doing intensive psychotherapy with schizophrenic patients, I began to realize that schizophrenic experience and behavior consists, surprisingly frequently, in the patient's responding to other persons' unconscious processes. I had long been aware of the tremendous importance of projection in these patients' illnesses; but I was slower to see the great—perhaps equally tremendous—part which introjection plays, too, in schizophrenia and, hence, in the psychotherapy of schizophrenia. On theoretical grounds one can readily think, concerning any patient whose ego-boundaries are so incomplete as to facilitate massive projection, that by the same token he will be profoundly susceptible, also, to introjection. But in actual clinical work, introjection is a process which is in most instances much more subtle, much less conspicuously displayed, than is projection, and its detection in the arena of the therapeutic relationship tends to call for a higher degree of self-awareness in the therapist than the noticing of the patient's projection generally requires.","text":"— Harold F. Searles, “The Schizophrenic's Vulnerability to the Therapist's Unconscious Processes,” *J. Nerv. Ment. Dis.* 127 (1958), opening paragraph, p. 247\n\nOCR hyphenation and the typo “schizophrenie” corrected from the pasted text; page assumed to be the article's first page since this is its opening paragraph — check.","image":null},{"id":"Winnicott — the squiggle game and string","type":"quote","title":"Winnicott — the squiggle game and string","stub":false,"captured":"2026-10-05","publish":false,"themes":["Family","The clinic"],"fields":["psychoanalysis"],"work":"Transitional Objects and Transitional Phenomena","page":null,"edition":1971,"speaker":"","quote":"After this interview with the parents I saw the boy in a personal interview. There were present two psychiatric social workers and two visitors. The boy did not immediately give an abnormal impression and he quickly entered into a squiggle game with me. (In this squiggle game I make some kind of an impulsive line-drawing and invite the child whom I am interviewing to turn it into something, and then he makes a squiggle for me to turn into something in my turn.)\n\nThe squiggle game in this particular case led to a curious result. The boy's laziness immediately became evident, and also nearly everything I did was translated by him into something associated with string. Among his ten drawings there appeared the following:\n\nlasso\nwhip\ncrop\na yo-yo string\na string in a knot\nanother crop\nanother whip.","text":"— D. W. Winnicott, “Transitional Objects and Transitional Phenomena,” *Playing and Reality* (Tavistock, 1971), the “String” case; page not yet fixed (c. p. 17 in the 1971 edition — verify)","image":null},{"id":"Your Body Remembers — shoulders carry what we feel responsible for","type":"quote","title":"Your Body Remembers — shoulders carry what we feel responsible for","stub":false,"captured":"2026-10-05","publish":false,"themes":["Emotion","The body"],"fields":[],"work":" o","title":"Classical Chinese","stub":true},{"id":"Frank Wilhoit — Wilhoit's law","type":"text","title":"Wilhoit's law","stub":false,"kind":"post","captured":"2026-10-05","publish":false,"themes":["Power and political economy","Law and power"],"fields":[],"author":["Frank Wilhoit"],"translator":[],"date":"2018-03-22","source":"Comment #26 on John Holbo, “The Travesty of Liberalism,” Crooked Timber, 21–22 March 2018","sourceUrl":"https://crookedtimber.org/2018/03/21/liberals-against-progressives/","work":"","language":"English","via":"","text":"Conservatism consists of exactly one proposition, to wit: There must be in-groups whom the law protects but does not bind, alongside out-groups whom the law binds but does not protect.\n\nUsually quoted as the second sentence alone and attributed to the wrong Wilhoit; the author is the composer Frank Wilhoit, writing in a blog comment thread. The pasted version (“Wilhoit's Law strikes again. …”) is someone's later citation of it.","image":null},{"id":"Law and power","type":"theme","title":"Law and power","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"proposed":true,"text":"Who the law binds and who it protects.","parent":"Power and political economy","aliases":[]},{"id":"Frank Wilhoit","type":"person","title":"Frank Wilhoit","stub":false,"captured":"","publish":false,"themes":[],"fields":[],"roles":["author"],"born":"","died":"","nationality":"American","aliases":[],"text":"Composer and software architect — not the political scientist Francis M. Wilhoit (1920–2010), to whom the 'law' is often misattributed."},{"id":"Issa — A bath when you're born","type":"text","title":"A bath when you're born","stub":false,"kind":"poem","captured":"2026-10-05","publish":false,"themes":["Mourning","Death","Grief and elegy"],"fields":["literature","poetry"],"author":["Kobayashi Issa"],"translator":["Robert Hass"],"date":"","source":"Robert Hass, ed., The Essential Haiku: Versions of Bashō, Buson, and Issa (Hopewell, NJ: Ecc   const keep = new Set();
  DATA.nodes.forEach(n => { if (!visible[n.type]) return; if (n.stub && !showStubs && n.type!=="theme" && n.id!==selected) return; keep.add(n.id); });
  const prev = nodeById;
  const nodes = DATA.nodes.filter(n=>keep.has(n.id)).map(n => { const o = prev.get(n.id); return Object.assign({r:radius(n)}, n, o ? {x:o.x,y:o.y,vx:0,vy:0} : {}); });
  const links = DATA.edges.filter(e=>keep.has(e.source)&&keep.has(e.target)).map(e=>({source:e.source,target:e.target,w:e.w,field:e.field}));
  nodeById = new Map(nodes.map(n=>[n.id,n]));
  return {nodes, links};
}
function neighborSet(id){ const s = new Set([id]); (nbrs.get(id)||[]).forEach(x => s.add(x.id)); return s; }
let focusSet = null;   // ids to keep bright

function alphaFor(id){ return focusSet && !focusSet.has(id) ? .12 : 1; }

const Graph = ForceGraph()(el)
  .nodeId("id").nodeLabel(() => "").nodeRelSize(1).nodeVal(n => n.r*n.r/8)
  .backgroundColor("rgba(0,0,0,0)")
  .linkColor(l => { const a = focusSet ? ((focusSet.has(l.source.id) && focusSet.has(l.target.id)) ? .9 : .05) : .42; return C.edge.replace(/[\d.]+\)$/, a+")"); })
  .linkWidth(l => .35 + l.w*.55)
  .linkDirectionalParticles(l => selected && (l.source.id===selected || l.target.id===selected) ? Math.round(1 + l.w*2) : 0)
  .linkDirectionalParticleWidth(l => 1.5 + l.w)
  .linkDirectionalParticleColor(() => C.capture)
  .nodeCanvasObjectMode(() => "replace")
  .nodeCanvasObject((n, ctx, k) => {
    const col = colorOf(n.type), a = alphaFor(n.id), r = n.r;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(n.x, n.y);
    const stroke = n.stub ? col : C.bg, fill = n.stub ? C.bg : col;
    ctx.lineWidth = 1.4 / Math.sqrt(k); if (n.stub) ctx.setLineDash([2/k, 2/k]);
    if (n.type==="field"){
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = C.bg; ctx.fill(); ctx.lineWidth = 2.2/Math.sqrt(k); ctx.strokeStyle = col; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fillStyle = col; ctx.fill();
    } else if (n.type==="work"){
      const book = n.kind!=="article", w = book?r*1.3:r*1.9, h = book?r*1.9:r*1.3;
      ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,1.5); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.stroke();
    } else if (n.type==="image" && thumbs.get(n.id) && thumbs.get(n.id).complete && thumbs.get(n.id).naturalWidth){
      const im = thumbs.get(n.id), s = r*2;
      ctx.beginPath(); ctx.roundRect(-r-1.5,-r-1.5,s+3,s+3,4); ctx.fillStyle = col; ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.roundRect(-r,-r,s,s,3); ctx.clip();
      const iw = im.naturalWidth, ih = im.naturalHeight, sc = Math.max(s/iw, s/ih), dw = iw*sc, dh = ih*sc;
      ctx.drawImage(im, -dw/2, -dh/2, dw, dh); ctx.restore();
    } else if (n.type==="text"){
      ctx.rotate(Math.PI/4); ctx.beginPath(); ctx.roundRect(-r*.75,-r*.75,r*1.5,r*1.5,1); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.stroke(); ctx.rotate(-Math.PI/4);

    } else {
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.stroke();
    }
    ctx.setLineDash([]);
    if (n.id===selected || (searchHits && searchHits.has(n.id))){ ctx.beginPath(); ctx.arc(0,0,r+3,0,Math.PI*2); ctx.lineWidth = 2/Math.sqrt(k); ctx.strokeStyle = C.focus; ctx.stroke(); }
    // label — level of detail: anchors always, others when zoomed in, hovered or in focus
    const show = labelOn(n) || k > 2.2 || (hovered && hovered.id===n.id) || (focusSet && focusSet.has(n.id) && focusSet.size < 40);
    if (show && !(n.type==="image" && !(hovered && hovered.id===n.id) && n.id!==selected)){
      const serif = n.type==="field" || n.type==="work";
      const fs = (n.type==="field" ? 15 : n.type==="work" ? 11.5 : 10) / Math.pow(k, .75);
      ctx.font = `${n.type==="theme"?"500 ":""}${fs}px ${serif ? '"Young Serif",Georgia,serif' : '"Public Sans",system-ui,sans-serif'}`;
      ctx.textBaseline = "middle"; ctx.textAlign = "left";

  .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r+4, 0, Math.PI*2); ctx.fill(); })

function grouped(id, exclude=[]){

});
document.getElementById("fit").onclick = () => fit();
document.getElementById("clear").onclick = () => { Object.entries(TYPES).forEach(([k,v])=>visible[k]=v.on); showStubs=false; buildFilters(); save(); select(null); render(); };
document.addEventListener("keydown", e => { if (e.key==="Escape"){ select(null); document.getElementById("q").value=""; } });

// ---------- search ----------
const hay = new Map(DATA.nodes.map(n => [n.id, [n.title, n.quote, n.text, (n.author||[]).join(" "), (n.creator||[]).join(" "), n.source, n.summary, (n.aliases||[]).join(" ")].filter(Boolean).join(" ").toLowerCase()]));
const q = document.getElementById("q");
q.addEventListener("input", e => {
  const s = e.target.value.trim().toLowerCase();
  if (!s){ searchHits = null; recomputeFocus(); if (!selected) showHome(); return; }
  searchHits = new Set(DATA.nodes.filter(n => hay.get(n.id).includes(s)).map(n=>n.id)); recomputeFocus();
  const list = DATA.nodes.filter(n => hay.get(n.id).includes(s)).slice(0,30);
  panel.innerHTML = `<p class="eyebrow">Search</p><h2>${list.length} ${list.length===1?"match":"matches"}</h2><ul class="rank">${list.map(n=>row(n, TYPES[n.type].label, n.type==="quote"?n.quote:n.type==="text"?(n.text||"").split("\n")[0]:(n.author||n.creator||[]).join(", "))).join("")||"<li class='empty'>Nothing matches.</li>"}</ul>`;
});
q.addEventListener("keydown", e => { if (e.key!=="Enter") return; const s = q.value.trim().toLowerCase(); const n = DATA.nodes.find(n => hay.get(n.id).includes(s)); if (n) select(n.id); });

showHome(); render();
</script>
