<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Library Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height app — header strip, graph canvas left, reading panel right (stacks under the graph on phones). */
:root{
  --bg:#E9ECF0; --surface:#F7F8FA; --ink:#1A2132; --muted:#586174; --line:rgba(26,33,50,.13); --edge:rgba(26,33,50,.22);
  --book:#1A2132; --theme:#A1346A; --person:#1C766F; --imprint:#5F50B0; --geo:#3D7430; --honor:#A8720E;
  --focus:#2C5BD6;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#161B25; --ink:#E4E8EF; --muted:#9AA3B5; --line:rgba(228,232,239,.12); --edge:rgba(228,232,239,.2);
  --book:#E4E8EF; --theme:#E57BB0; --person:#58C3BA; --imprint:#A99BF2; --geo:#8BC474; --honor:#E4B24F; --focus:#7FA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#161B25; --ink:#E4E8EF; --muted:#9AA3B5; --line:rgba(228,232,239,.12); --edge:rgba(228,232,239,.2);
  --book:#E4E8EF; --theme:#E57BB0; --person:#58C3BA; --imprint:#A99BF2; --geo:#8BC474; --honor:#E4B24F; --focus:#7FA2FF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-inline:16px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;padding-block:14px 8px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.005em}
.count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:500 .8rem var(--f-body);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=search]{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:180px;max-width:100%}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:4px 10px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:.8rem var(--f-body);cursor:pointer;padding:3px 2px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.book .sw{border-radius:2px;width:8px;height:11px}
.chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip .n{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.slider{display:none;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-left:auto}
.slider.on{display:flex}
.slider input{accent-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#graph svg{width:100%;height:100%;display:block;cursor:grab}
#graph svg:active{cursor:grabbing}
.hint{position:absolute;left:0;bottom:10px;font-size:.72rem;color:var(--muted);pointer-events:none}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:18px 0 24px 20px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
aside h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
aside h3{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:20px 0 8px}
.byline{color:var(--muted);margin:0}
.cover{width:112px;aspect-ratio:2/3;max-width:100%;border-radius:2px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.12)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.type{display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px;box-sizing:border-box;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:.8rem;line-height:1.2}
.cover.type small{font-family:var(--f-body);font-size:.6rem;opacity:.75}
.quote{font-family:var(--f-display);font-size:1rem;line-height:1.45;margin:14px 0 0;padding-left:12px;border-left:2px solid var(--line)}
.summary{margin:12px 0 0;max-width:62ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:.82rem}
dt{color:var(--muted)} dd{margin:0;min-width:0}
.mono{font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;font:.76rem var(--f-body);padding:3px 9px;cursor:pointer}
.tag:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
ol.rank,ul.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:5px 6px;border-radius:6px;cursor:pointer}
.rank button:hover,.rank button:focus-visible{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.rank .t{min-width:0}
.rank .t i{font-style:italic}
.rank .why{display:block;font-size:.74rem;color:var(--muted)}
.bar{display:inline-block;height:4px;border-radius:2px;background:var(--ink);opacity:.55;vertical-align:middle;margin-right:6px}
.back{all:unset;cursor:pointer;font-size:.78rem;color:var(--muted);margin-bottom:12px;display:inline-block}
.back:hover{color:var(--ink)}
.node text{font-family:var(--f-body);font-size:10px;fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.book text{font-family:var(--f-display);font-size:11.5px;fill:var(--ink)}
.node{cursor:pointer}
.link{stroke:var(--edge);fill:none}
.dim{opacity:.12}
.node.hit rect,.node.hit circle{stroke:var(--focus);stroke-width:2.5px}
@media (max-width:760px){
  .app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  #graph{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:18px 0 32px}
  .tools{margin-left:0}
}
</style>

<div class="app">
  <header>
    <h1>Library Constellation</h1>
    <span class="count" id="count"></span>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button id="m-web" aria-pressed="true">Web</button>
        <button id="m-kin" aria-pressed="false">Kinship</button>
      </div>
      <input type="search" id="q" placeholder="Find a book, poet, theme…" aria-label="Search the library">
    </div>
  </header>
  <div class="filters" id="filters">
    <button class="chip" id="f-leaf" style="--c:var(--muted)" aria-pressed="false"><span class="sw"></span>Single-book ties</button>
    <div class="slider" id="slider"><label for="thr">Weakest tie shown</label><input type="range" id="thr" min="0" max="100" value="35"><span class="mono" id="thrv"></span></div>
  </div>
  <main>
    <div id="graph"><svg id="svg" role="img" aria-label="Network of books and what connects them"></svg><div class="hint">Drag to pan · scroll or pinch to zoom · click a node to read it</div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

const books = DATA.books, N = books.length;
const ents = new Map(); // id -> {id,name,type,books:[{book,field}]}
books.forEach(b => b.links.forEach(l => {
  const id = l.type + ":" + l.target;
  if (!ents.has(id)) ents.set(id, {id, name:l.target, type:l.type, books:[]});
  ents.get(id).books.push({book:b, field:l.field});

// Inverse-frequency weighting: a tie shared by few books says more than one shared by all.
ents.forEach(e => { const df = new Set(e.books.map(x => x.book.id)).size; e.df = df; e.idf = Math.log(1 + N / df); });

const pairs = new Map(); // "a|b" -> {a,b,w,shared:[]}
ents.forEach(e => {
  if (e.df > N*0.5) return; // near-universal (e.g. English) says nothing about kinship
  const list = e.books;
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++){
    const A=list[i], B=list[j]; if (A.book===B.book) continue;
    const [a,b] = A.book.id < B.book.id ? [A,B] : [B,A];
    const k = a.book.id+"|"+b.book.id;
    const w = Math.min(DATA.fieldWeights[a.field], DATA.fieldWeights[b.field]) * e.idf;
    if (!pairs.has(k)) pairs.set(k,{a:a.book,b:b.book,w:0,shared:[]});
    const p = pairs.get(k); p.w += w; p.shared.push(e);

const pairList = [...pairs.values()].sort((x,y)=>y.w-x.w);

books.forEach(b => { b.kin = pairList.filter(p=>p.a===b||p.b===b).map(p=>({other:p.a===b?p.b:p.a,w:p.w,shared:p.shared})); b.kinSum = d3.sum(b.kin,k=>k.w); });

function size(){ const r = document.getElementById("graph").getBoundingClientRect(); return [Math.max(r.width,300), Math.max(r.height,300)]; }

function buildWeb(){
  const nodes = books.map(b => ({id:b.id, type:"book", name:b.title, book:b}));
  const links = [];
  ents.forEach(e => {
    if (!visible[e.type]) return;
    if (!leaves && e.df < 2 && selected !== e.id) return;
    nodes.push({id:e.id, type:e.type, name:e.name, ent:e});
    e.books.forEach(x => links.push({source:x.book.id, target:e.id, w:DATA.fieldWeights[x.field]}));
  });
  nodes.forEach(n => {
    n.r = n.type==="book" ? 7 + Math.sqrt(links.filter(l=>l.source===n.id).length)*1.6 : 3.5 + Math.sqrt(n.ent.df)*3.2;
  });
  return {nodes, links};
}
function buildKin(){
  const cut = maxPair * (+thr.value/100) * .6;
  thrv.textContent = cut.toFixed(1);
  const allowed = new Set(Object.keys(visible).filter(t=>visible[t]));
  const links = [];
  pairList.forEach(p => {
    const shared = p.shared.filter(e=>allowed.has(e.type));
    const w = d3.sum(shared, e => e.idf * DATA.fieldWeights[e.books.find(x=>x.book===p.a).field]);
    if (w > 0 && w >= cut) links.push({source:p.a.id, target:p.b.id, w, shared});
  });
  const nodes = books.map(b => ({id:b.id, type:"book", name:b.title, book:b, r: 7 + Math.sqrt(b.kinSum)*1.3}));
  return {nodes, links};
}

function render(){
  const [W,H] = size();
  svg.attr("viewBox", [-W/2,-H/2,W,H]);
  sliderEl.classList.toggle("on", mode==="kin");
  current = mode==="web" ? buildWeb() : buildKin();
  current.nodes.forEach(n => { const p = pos.get(n.id); if (p){ n.x=p.x; n.y=p.y; } });
  const maxW = d3.max(current.links, l=>l.w) || 1;

  linkSel = gLinks.selectAll("line").data(current.links, l => (l.source.id||l.source)+"~"+(l.target.id||l.target))
    .join("line").attr("class","link")
    .attr("stroke-width", l => mode==="web" ? .6 + l.w*1.2 : .6 + 7*Math.pow(l.w/maxW,1.4))
    .attr("stroke-opacity", l => mode==="web" ? .35 + l.w*.45 : .15 + .85*(l.w/maxW));

  nodeSel = gNodes.selectAll("g.node").data(current.nodes, d=>d.id).join(enter => {
    const g = enter.append("g").attr("tabindex",0).attr("role","button");
    g.each(function(d){
      const s = d3.select(this);
      if (d.type==="book") s.append("rect"); else s.append("circle");
      s.append("text");
    });
    return g;
  });
  nodeSel.attr("class", d => "node " + d.type).attr("aria-label", d => d.name);

    .attr("fill", "var(--book)").attr("stroke","var(--bg)").attr("stroke-width",1.5);
  nodeSel.select("circle").attr("r",d=>d.r).attr("fill",d=>`var(--${d.type})`).attr("fill-opacity",.9).attr("stroke","var(--bg)").attr("stroke-width",1.2);
  nodeSel.select("text").text(d => d.name).attr("x", d => d.type==="book" ? d.r*.9 : d.r+3).attr("y", 4)
    .attr("display", d => d.type==="book" || d.ent.df>=2 ? null : "none");
  nodeSel.on("click", (e,d) => select(d.id)).on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);} })
    .on("mouseenter", (e,d) => { if(!selected) highlight(d.id); d3.select(e.currentTarget).select("text").attr("display",null); })
    .on("mouseleave", (e,d) => { if(!selected) highlight(null); if(d.type!=="book" && d.ent.df<2 && selected!==d.id) d3.select(e.currentTarget).select("text").attr("display","none"); })

    .force("link", d3.forceLink(current.links).id(d=>d.id)
      .distance(l => mode==="web" ? 34 + 50/(l.w+.4) : 260 - 180*(l.w/maxW))
      .strength(l => mode==="web" ? Math.min(.9,.15+l.w*.35) : .05 + .6*Math.pow(l.w/maxW,1.5)))

    .force("collide", d3.forceCollide(d => d.r + (d.type==="book"?14:5)))
    .force("x", d3.forceX(0).strength(mode==="web"?.04:.07)).force("y", d3.forceY(0).strength(mode==="web"?.06:.09))
    .on("tick", tick).on("end", () => fit(true));
  if (reduce){ sim.stop(); for(let i=0;i<320;i++) sim.tick(); tick(); fit(false); }
  else sim.alpha(pos.size ? .6 : 1).restart();
  if (selected && !current.nodes.find(n=>n.id===selected)) selected = null;

}

  const [W,H] = size(), pad = 28;
  const xs = current.nodes.map(n=>n.x), ys = current.nodes.map(n=>n.y);
  const x0 = d3.min(xs)-20, x1 = d3.max(xs)+140, y0 = d3.min(ys)-20, y1 = d3.max(ys)+20; // room for right-hand labels
  const k = Math.max(W < 600 ? .75 : .3, Math.min(1.4, (W-2*pad)/(x1-x0), (H-2*pad)/(y1-y0)));
  const tr = d3.zoomIdentity.scale(k).translate(-(x0+x1)/2, -(y0+y1)/2);
  (animate && !reduce ? svg.transition().duration(600) : svg).call(zoom.transform, tr);
}
function tick(){
  linkSel.attr("x1",l=>l.source.x).attr("y1",l=>l.source.y).attr("x2",l=>l.target.x).attr("y2",l=>l.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  current.nodes.forEach(n => pos.set(n.id,{x:n.x,y:n.y}));
}
function neighbors(id){
  const s = new Set([id]);
  current.links.forEach(l => { const a=l.source.id||l.source, b=l.target.id||l.target; if(a===id) s.add(b); if(b===id) s.add(a); });
  return s;
}
function highlight(id){
  if (!nodeSel) return;
  if (!id){ nodeSel.classed("dim",false).classed("hit",false); linkSel.classed("dim",false); return; }
  const nb = neighbors(id);
  nodeSel.classed("dim", d=>!nb.has(d.id)).classed("hit", d=>d.id===id);
  linkSel.classed("dim", l => (l.source.id!==id && l.target.id!==id));
  nodeSel.filter(d=>nb.has(d.id)).select("text").attr("display",null);
}

// ---------- panel ----------
const panel = document.getElementById("panel");
function tagBtn(e){ return `<button class="tag" style="--c:var(--${e.type})" data-go="${esc(e.id)}">${esc(e.name)}</button>`; }
function bookRow(b, right, why){
  return `<li><button data-go="${esc(b.id)}"><span class="t"><i>${esc(b.title)}</i> · ${esc(b.author.join(", "))}${why?`<span class="why">${why}</span>`:""}</span><span class="mono">${right??""}</span></button></li>`;
}
function coverHTML(b){
  const fallback = `<div class="cover type" aria-hidden="true"><span>${esc(b.title)}</span><small>${esc(b.author.join(", "))}</small></div>`;
  if (!b.cover) return fallback;
  return `<div class="cover"><img src="${esc(b.cover)}" alt="Cover of ${esc(b.title)}" onerror="this.parentNode.outerHTML=this.parentNode.nextElementSibling.innerHTML"></div><template>${fallback}</template>`;
}
function showHome(){
  const top = [...ents.values()].filter(e=>e.type==="theme").sort((a,b)=>b.df-a.df||a.name.localeCompare(b.name));
  const hubs = [...ents.values()].filter(e=>e.type!=="theme" && e.type!=="geo" && e.df>=2).sort((a,b)=>b.df-a.df);
  panel.innerHTML = `
    <p class="eyebrow">Camille's library</p>
    <h2>${N} books, joined by what they share</h2>
    <p class="summary">Each tie is weighted: a shared theme or author counts for more than a shared city, and a theme held by only a few books counts for more than one held by many. <b>Web</b> shows books with the ideas, people and prizes between them. <b>Kinship</b> collapses those into direct book-to-book ties, drawn thicker the more two books share.</p>
    <h3>Strongest kinships</h3>
    <ol class="rank">${pairList.slice(0,6).map(p=>`<li><button data-go="${esc(p.a.id)}"><span class="t"><i>${esc(p.a.title)}</i> ↔ <i>${esc(p.b.title)}</i><span class="why">${esc(p.shared.map(e=>e.name).join(" · "))}</span></span><span class="mono">${p.w.toFixed(1)}</span></button></li>`).join("")}</ol>
    <h3>Themes by reach</h3>
    <ul class="rank">${top.map(e=>`<li><button data-go="${esc(e.id)}"><span class="t"><span class="bar" style="width:${e.df*12}px;background:var(--theme)"></span>${esc(e.name)}</span><span class="mono">${e.df}</span></button></li>`).join("")}</ul>
    <h3>Shared people, presses and prizes</h3>
    <div class="tags">${hubs.map(tagBtn).join("")}</div>`;
}
function showBook(b){
  const groups = {};
  b.links.forEach(l => (groups[l.field] ||= []).push(ents.get(l.eid)));
  const row = (label, v) => v ? `<dt>${label}</dt><dd>${v}</dd>` : "";
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    ${coverHTML(b)}
    <p class="eyebrow">${esc(b.genre.join(" · ") || "book")}</p>
    <h2>${esc(b.title)}</h2>
    <p class="byline">${esc(b.author.join(", "))}${b.translator.length?` · tr. ${esc(b.translator.join(", "))}`:""}${b.editor.length?` · ed. ${esc(b.editor.join(", "))}`:""}</p>
    ${b.firstLine ? `<blockquote class="quote">${esc(b.firstLine)}</blockquote>` : ""}
    ${b.summary ? `<p class="summary">${esc(b.summary)}</p>` : ""}
    <dl>${row("Publisher", esc(b.publisher))}${row("This edition", b.year?`<span class="mono">${esc(b.year)}</span>`:"")}${row("First published", esc(b.first))}${row("Language", esc(b.language))}${row("ISBN", b.isbn?`<span class="mono">${esc(b.isbn)}</span>`:"")}</dl>
    ${groups.themes ? `<h3>Themes</h3><div class="tags">${groups.themes.map(tagBtn).join("")}</div>` : ""}
    ${(groups.awards||groups.shortlists) ? `<h3>Honors</h3><div class="tags">${[...(groups.awards||[]),...(groups.shortlists||[])].map(tagBtn).join("")}</div>` : ""}
    <h3>Nearest books</h3>
    <ol class="rank">${b.kin.sort((x,y)=>y.w-x.w).slice(0,8).map(k=>bookRow(k.other, k.w.toFixed(1), esc(k.shared.map(e=>e.name).join(" · ")))).join("") || "<li class='why'>No shared ties yet.</li>"}</ol>`;
}
function showEnt(e){
  const seen = new Set();
  const rows = e.books.filter(x => !seen.has(x.book.id) && seen.add(x.book.id));
  panel.innerHTML = `
    <button class="back" data-home>← Library</button>
    <p class="eyebrow" style="color:var(--${e.type})">${esc(TYPES[e.type].label)}</p>
    <h2>${esc(e.name)}</h2>
    <p class="byline">${e.df} ${e.df===1?"book":"books"} · weight per tie <span class="mono">${e.idf.toFixed(2)}</span></p>
    <h3>Books</h3>
    <ol class="rank">${rows.map(x=>bookRow(x.book, "", esc(e.books.filter(y=>y.book===x.book).map(y=>FIELD_LABEL[y.field]).join(", ")))).join("")}</ol>`;
}
function select(id){
  selected = id;
  if (!id){ showHome(); highlight(null); return; }
  if (id.startsWith("book:")) showBook(bookById.get(id)); else showEnt(ents.get(id));
  if (!current.nodes.find(n=>n.id===id) && !id.startsWith("book:")){ visible[ents.get(id).type]=true; document.getElementById("f-"+ents.get(id).type).setAttribute("aria-pressed",true); if(mode==="web") render(); }
  highlight(id);
  const n = current.nodes.find(n=>n.id===id);
  if (n && n.x!=null){ const t = d3.zoomTransform(svg.node()); svg.transition().duration(reduce?0:500).call(zoom.translateTo, n.x, n.y); }
  panel.scrollTop = 0;
}
panel.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) return select(go.dataset.go);
  if (e.target.closest("[data-home]")) select(null);
});
svg.on("click", e => { if (e.target === svg.node()) select(null); });

// ---------- controls ----------
function setMode(m){ mode=m; pos.clear(); userZoomed=false; document.getElementById("m-web").setAttribute("aria-pressed",m==="web"); document.getElementById("m-kin").setAttribute("aria-pressed",m==="kin"); render(); }
document.getElementById("m-web").onclick = () => setMode("web");
document.getElementById("m-kin").onclick = () => setMode("kin");
thr.oninput = () => render();
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ highlight(selected); return; }
  const hits = new Set(current.nodes.filter(n => n.name.toLowerCase().includes(q) || (n.book && n.book.author.join(" ").toLowerCase().includes(q))).map(n=>n.id));
  nodeSel.classed("dim", d=>!hits.has(d.id)).classed("hit", d=>hits.has(d.id));
  nodeSel.filter(d=>hits.has(d.id)).select("text").attr("display",null);
  linkSel.classed("dim", true);
});
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key!=="Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const n = current.nodes.find(n => n.name.toLowerCase().includes(q)); if (n) select(n.id);
});
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(()=>{ const [W,H]=size(); svg.attr("viewBox",[-W/2,-H/2,W,H]); }, 150); });

showHome(); render();
</script>

</body>
</html>
